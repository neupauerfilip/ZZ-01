  .topic-motto{display:none}
  .topic-mode-bar{grid-template-columns:1fr}
  .topic-list-row{grid-template-columns:54px minmax(0,1fr)}
  .topic-list-pick{grid-column:1/-1;width:100%}
  .topic-wheel-actions{grid-template-columns:1fr}
  .topic-manual-panel{grid-template-columns:1fr;grid-template-areas:"icon" "label" "input" "save" "button";text-align:center}
  .topic-manual-icon{justify-self:center}
  .topic-save-check{justify-content:center}
  .topic-use-manual{width:100%}
}


@media (max-width:720px){
  .home-bottom-decor{grid-template-columns:1fr;justify-items:center}
  .home-lockers-decor,.home-books-decor{display:none}
  .arcade-home-title::before,.arcade-home-title::after{display:none}
}
@media print{
  body{background:#fff!important;color:#000!important}
  .topbar,.grade-actions,.tabs,.offline-banner,.toast-root,.modal-root{display:none!important}
  .container{max-width:none!important;padding:0!important}
  .pixel-frame,.card{border:0!important;box-shadow:none!important;background:#fff!important;color:#000!important;padding:0!important}
  .gradebook-scroll{border:0!important;overflow:visible!important}
  .gradebook-table{min-width:0!important;width:100%!important;color:#000!important;background:#fff!important}
  .gradebook-table th,.gradebook-table td{position:static!important;background:#fff!important;color:#000!important;border:1px solid #555!important;font-size:9pt!important;padding:5px!important}
}


/* ======================================================================
   VISUAL PASS V1 — HLAVNÍ MENU + ZAHÁJENÍ ZKOUŠENÍ
   Vychází ze schválených pixel-art referencí ZZ-01.
   Funkční logika zůstává zachována.
   ====================================================================== */
:root{
  --pixel:"Courier New",ui-monospace,monospace;
  --arcade-bg:#031426;
  --arcade-panel:#051d31;
  --arcade-panel-2:#08263a;
  --arcade-cyan:#28e2f1;
  --arcade-cyan-dark:#087c9b;
  --arcade-orange:#ff8514;
  --arcade-orange-hi:#ffbd3c;
  --arcade-cream:#fff0bd;
  --arcade-ink:#08101a;
}
body{
  background:
    radial-gradient(circle at 50% -12%,rgba(18,146,194,.22),transparent 32%),
    radial-gradient(circle at 10% 20%,rgba(8,85,123,.12),transparent 24%),
    linear-gradient(180deg,#021225 0%,#03172a 52%,#020d19 100%);
  background-attachment:fixed;
}
.crt-overlay{opacity:.24}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:-1;background:repeating-linear-gradient(90deg,rgba(28,139,181,.06) 0 2px,transparent 2px 42px),repeating-linear-gradient(0deg,rgba(28,139,181,.045) 0 2px,transparent 2px 42px);opacity:.38}
.container{width:min(940px,100%);padding:18px 22px 38px}
.topbar{
  position:sticky;top:8px;
  width:min(940px,calc(100% - 28px));
  margin:10px auto 0;
  padding:11px 16px;
  border:4px solid var(--arcade-cyan);
  border-bottom-width:7px;
  background:linear-gradient(180deg,rgba(2,18,36,.98),rgba(4,26,47,.98));
  box-shadow:0 0 0 4px #01101d,0 0 0 7px #063c52,0 10px 0 #010913;
  backdrop-filter:none;
}
.brand-lockup{display:flex;align-items:center;gap:12px;min-width:0}
.brand-mark{width:64px;height:64px;object-fit:cover;image-rendering:pixelated;flex:0 0 auto}
.brand-copy{min-width:0;line-height:1}
.brand-main{
  font-family:var(--pixel);font-weight:900;font-size:clamp(1.14rem,3.7vw,1.9rem);
  letter-spacing:.045em;color:#fff3d8;white-space:nowrap;text-transform:uppercase;
  text-shadow:0 3px 0 #ff8a12,0 6px 0 #9d3206,3px 6px 0 #011019;
}
.brand-code{margin-top:6px;font-family:var(--pixel);font-weight:900;letter-spacing:.18em;color:#39ecff;font-size:.84rem}
.context-strip{display:none}
.nav-actions{gap:7px}
.topbar .icon-btn{
  min-width:46px;min-height:46px;padding:5px 8px;border:0;box-shadow:none;
  background:transparent;color:var(--arcade-cyan);font-size:1.5rem;
}
.topbar .icon-btn:hover{background:#08283a;filter:none}
.topbar .icon-btn.account-exit{border:0;background:transparent;color:var(--arcade-cyan)}
.topbar .avatar-chip{transform:scale(.92)}
.screen-nav{
  width:min(900px,calc(100% - 28px));margin:16px auto 0;
  display:flex;align-items:center;justify-content:space-between;gap:10px;
}
.screen-nav .back-nav-btn,.screen-nav .home-nav-btn{
  min-height:40px;padding:5px 4px;border:0;background:transparent;box-shadow:none;
  color:var(--arcade-cyan);font-family:var(--pixel);font-size:.8rem;
}
.screen-nav .back-nav-btn:hover,.screen-nav .home-nav-btn:hover{background:transparent;color:var(--arcade-cream)}
.screen-nav .back-arrow{font-size:1.35em;margin-right:5px}

/* Hlavní menu */
.arcade-home-head{text-align:center;margin:26px 0 22px;padding:10px 0 0}
.arcade-home-title{
  margin:0;font-family:var(--pixel);font-weight:900;letter-spacing:.04em;text-transform:uppercase;
  font-size:clamp(2.2rem,8.4vw,5.4rem);line-height:.88;color:#fff3d9;
  text-shadow:0 4px 0 #ff9717,0 8px 0 #a83505,4px 8px 0 #010913,-4px 0 0 rgba(24,220,237,.18),4px 0 0 rgba(24,220,237,.18);
}
.arcade-home-title::before,.arcade-home-title::after{content:"▣";color:var(--arcade-cyan);font-size:.26em;vertical-align:middle;text-shadow:none;margin:0 .38em .08em}
.arcade-home-slogan{margin-top:18px;color:#3cf3ff;font-family:var(--pixel);font-weight:700;font-size:clamp(.84rem,2.7vw,1.15rem);letter-spacing:.03em}
.home-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:24px}
.home-card{
  min-height:136px;padding:14px 16px;display:grid;grid-template-columns:112px minmax(0,1fr);align-items:center;gap:10px;
  text-align:left;overflow:hidden;border:4px solid var(--arcade-cyan);border-radius:0;position:relative;
  background:linear-gradient(180deg,#08233a,#04182a);box-shadow:inset 0 0 0 3px #073a50,6px 6px 0 #010913;
}
.home-card::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.06),transparent 25%,transparent 78%,rgba(0,0,0,.16));pointer-events:none}
.home-card::after{display:none}
.home-card[data-action="exam"]{
  border-color:var(--arcade-orange-hi);background:linear-gradient(180deg,#ff9e1e,#ff7411);
  box-shadow:inset 0 0 0 4px #ffcf4a,inset 0 0 0 8px #c44808,6px 6px 0 #010913;color:var(--arcade-ink)
}
.home-card:hover{filter:brightness(1.12)}
.home-card:active{transform:translate(2px,2px);box-shadow:inset 0 0 0 3px #073a50,3px 3px 0 #010913}
.home-card[data-action="exam"]:active{box-shadow:inset 0 0 0 4px #ffcf4a,inset 0 0 0 8px #c44808,3px 3px 0 #010913}
.home-card h2{margin:0;font-family:var(--pixel);font-weight:900;font-size:clamp(1rem,3.8vw,1.48rem);line-height:1.08;text-transform:none;letter-spacing:0;text-shadow:none}
.home-card[data-action="exam"] h2{color:#111;text-shadow:none}
.home-card .home-icon{width:100%;height:96px;display:grid;place-items:center;font-size:0;overflow:hidden}
.home-card .home-icon img{width:100%;height:100%;object-fit:contain;image-rendering:pixelated}
.home-card-desc{display:none}
.home-card .unread-pill{margin-left:7px}
.home-divider{
  margin:24px 0 18px;display:flex;align-items:center;gap:12px;color:var(--arcade-cyan);
  font-family:var(--pixel);font-size:.72rem;letter-spacing:.12em;text-align:center;text-transform:uppercase
}
.home-divider::before,.home-divider::after{content:"";height:3px;flex:1;background:var(--arcade-cyan);box-shadow:0 3px 0 #054b61}
.home-overview-label{margin:0 0 9px;color:var(--arcade-cyan);font-family:var(--pixel);font-size:.72rem;letter-spacing:.12em;text-transform:uppercase}
.home-summary-grid{margin-top:0}
.arcade-footer{
  margin-top:26px;padding-top:13px;border-top:3px solid var(--arcade-cyan);display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:12px;
  color:var(--arcade-cyan);font-family:var(--pixel);font-size:.7rem;letter-spacing:.05em
}
.arcade-footer > :first-child{text-align:left}
.arcade-footer > :last-child{text-align:right}
.arcade-footer .footer-school{text-align:center;opacity:.92;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.home-bottom-decor{margin-top:18px;display:grid;grid-template-columns:110px 1fr 110px;align-items:end;gap:12px}
.home-books-decor,.home-lockers-decor{height:74px;display:flex;align-items:flex-end}
.home-books-decor img{width:100%;height:100%;object-fit:contain;image-rendering:pixelated;opacity:.95}
.home-lockers-decor{justify-content:flex-end;gap:8px}
.home-lockers-decor span{display:block;width:40px;height:72px;border:4px solid var(--arcade-cyan);background:linear-gradient(180deg,#08233a,#04182a);box-shadow:inset 0 0 0 3px #073a50}
.home-lockers-decor span::before{content:"";display:block;width:8px;height:8px;margin:12px auto 0;background:var(--arcade-orange-hi);box-shadow:0 14px 0 var(--arcade-cyan-dim),0 28px 0 var(--arcade-cyan-dim)}
.home-motto{text-align:center;color:var(--arcade-cyan);font-family:var(--pixel);font-size:.72rem;letter-spacing:.08em;align-self:center}

/* Zahájení zkoušení — krok 1 */
.exam-start{max-width:860px;margin:0 auto}
.exam-start-head{text-align:center;position:relative;margin:8px 0 22px;padding:4px 90px 0}
.exam-start-title{
  margin:0;color:var(--arcade-cream);font-family:var(--pixel);font-weight:900;text-transform:uppercase;
  font-size:clamp(2rem,7.2vw,4.4rem);line-height:.93;letter-spacing:.015em;
  text-shadow:0 3px 0 var(--arcade-orange),0 7px 0 #a92c08,4px 7px 0 #010913
}
.exam-start-title::before,.exam-start-title::after{content:"—";color:var(--arcade-cyan);font-size:.32em;vertical-align:middle;text-shadow:none;margin:0 .15em}
.exam-start-subtitle{margin-top:13px;color:var(--arcade-cyan);font-family:var(--pixel);font-weight:700;font-size:clamp(.9rem,2.8vw,1.18rem)}
.exam-step{position:absolute;right:0;bottom:-2px;color:var(--arcade-cyan);font-family:var(--pixel);font-weight:900;font-size:.8rem;letter-spacing:.04em}
.exam-start-section{margin-top:18px}
.arcade-section-label{display:flex;align-items:center;gap:12px;margin:0 0 8px;color:var(--arcade-cream)}
.arcade-section-label img{width:72px;height:64px;object-fit:contain;image-rendering:pixelated;flex:0 0 auto}
.arcade-section-label h2{margin:0;font-family:var(--pixel);font-weight:900;font-size:clamp(1.35rem,4.5vw,2.05rem)}
.arcade-select-wrap{position:relative}
.arcade-select-wrap::after{content:"⌄";position:absolute;right:18px;top:50%;transform:translateY(-54%);color:var(--arcade-cyan);font-size:2rem;font-weight:900;pointer-events:none}
.arcade-select{
  appearance:none;-webkit-appearance:none;width:100%;min-height:70px;padding:10px 56px 10px 22px;
  border:4px solid var(--arcade-cyan);border-radius:0;background:#061c30;color:var(--arcade-cream);
  box-shadow:inset 0 0 0 3px #07394e,5px 5px 0 #010913;font-family:var(--pixel);font-size:clamp(1rem,4vw,1.55rem);font-weight:900
}
.subject-choice-list{display:grid;gap:8px}
.arcade-subject-choice{
  width:100%;min-height:68px;padding:9px 17px;display:grid;grid-template-columns:44px minmax(0,1fr);gap:12px;align-items:center;
  text-align:left;border:4px solid var(--arcade-cyan);border-radius:0;background:#061c30;color:var(--arcade-cream);
  box-shadow:inset 0 0 0 3px #07394e,5px 5px 0 #010913;font-family:var(--pixel);font-weight:900;font-size:clamp(.9rem,3.3vw,1.28rem)
}
.arcade-subject-choice.selected{
  border-color:var(--arcade-orange-hi);background:linear-gradient(180deg,#ff9d1c,#ff7410);color:#101010;
  box-shadow:inset 0 0 0 4px #ffcf4a,inset 0 0 0 8px #c44808,5px 5px 0 #010913
}
.arcade-check{width:32px;height:32px;display:grid;place-items:center;border:3px solid currentColor;background:#071421;color:var(--arcade-cream);font-size:1.15rem}
.arcade-subject-choice.selected .arcade-check{background:var(--arcade-cream);color:#071421;border-color:#071421}
.subject-choice-note{display:block;margin-top:4px;font-family:"Courier New",monospace;font-size:.68rem;font-weight:400;opacity:.75}
.sr-only-select{position:absolute!important;width:1px!important;height:1px!important;padding:0!important;margin:-1px!important;overflow:hidden!important;clip:rect(0,0,0,0)!important;white-space:nowrap!important;border:0!important}
.exam-selection-summary{
  margin:18px 0 16px;padding:10px 16px;display:grid;grid-template-columns:92px minmax(0,1fr);gap:12px;align-items:center;
  border:4px solid var(--arcade-cyan);background:#061c30;box-shadow:inset 0 0 0 3px #07394e,5px 5px 0 #010913
}
.exam-selection-summary img{width:88px;height:76px;object-fit:contain;image-rendering:pixelated}
.selection-kicker{color:var(--arcade-cyan);font-family:var(--pixel);font-weight:900;font-size:.72rem;text-transform:uppercase;letter-spacing:.05em}
.selection-class{color:var(--arcade-orange-hi);font-family:var(--pixel);font-size:1.1rem;font-weight:900;margin-left:5px}
.selection-subject{margin-top:4px;color:var(--arcade-cream);font-weight:700;font-size:1rem;overflow-wrap:anywhere}
.exam-continue{
  width:100%;min-height:86px;padding:12px 22px;display:flex;align-items:center;justify-content:center;gap:16px;
  border:5px solid var(--arcade-orange-hi);border-radius:0;background:linear-gradient(180deg,#ff9d1c,#ff7410);color:#101010;
  box-shadow:inset 0 0 0 4px #ffd04e,inset 0 0 0 9px #c44808,6px 6px 0 #010913;
  font-family:var(--pixel);font-weight:900;font-size:clamp(1rem,4vw,1.55rem);text-transform:none
}
.exam-continue .arrow{font-size:1.45em;margin-left:auto}
.exam-continue:disabled{filter:grayscale(.65);opacity:.55}
.exam-start-empty{border:3px dashed var(--arcade-cyan-dark);padding:15px;color:var(--muted)}


/* ======================================================================
   VISUAL FIDELITY H3 — KROK 2/6: PŘÍTOMNOST
   Přesnější rekonstrukce podle schválené reference „Přítomnost žáků v Zkouškomatu“.
   Funkční logika přítomnosti zůstává beze změny.
   ====================================================================== */
.attendance-screen{max-width:860px;margin:0 auto;padding:0 0 4px}
.attendance-head{text-align:center;position:relative;margin:3px 0 17px;padding:0 96px 0}
.attendance-title{
  margin:0;color:#fff1bf;font-family:var(--pixel);font-weight:900;text-transform:uppercase;
  font-size:clamp(2.35rem,8.2vw,4.9rem);line-height:.93;letter-spacing:.012em;
  text-shadow:0 3px 0 #ff7120,0 7px 0 #b82d08,5px 8px 0 #010913
}
.attendance-subtitle{
  margin-top:12px;color:#25e8f4;font-family:var(--pixel);font-weight:900;
  font-size:clamp(.92rem,3vw,1.18rem);letter-spacing:.01em
}
.attendance-step{
  position:absolute;right:0;bottom:-2px;color:#25e8f4;font-family:var(--pixel);
  font-weight:900;font-size:.82rem;letter-spacing:.05em;white-space:nowrap
}
.attendance-context{
  margin:16px 0 12px;padding:12px 18px;display:grid;grid-template-columns:118px minmax(0,1fr);
  gap:12px;align-items:center;border:4px solid #25e8f4;background:linear-gradient(180deg,#08243a,#041a2c);
  box-shadow:inset 0 0 0 3px #07566c,inset 0 -5px 0 rgba(0,0,0,.28),5px 5px 0 #010913;
  clip-path:polygon(12px 0,calc(100% - 12px) 0,100% 12px,100% calc(100% - 12px),calc(100% - 12px) 100%,12px 100%,0 calc(100% - 12px),0 12px)
}
.attendance-context img{width:106px;height:86px;object-fit:contain;image-rendering:pixelated;filter:drop-shadow(3px 3px 0 #010913)}
.attendance-context-class{
  color:#fff3cf;font-family:var(--pixel);font-weight:900;
  font-size:clamp(1.05rem,4vw,1.62rem);line-height:1.13;letter-spacing:.01em
}
.attendance-context-subject{
  margin-top:7px;color:#fff3cf;font-family:var(--pixel);font-weight:900;
  font-size:clamp(.82rem,2.8vw,1.12rem);line-height:1.2
}
.attendance-list{
  display:flex;flex-direction:column;gap:8px;max-height:min(49vh,590px);overflow:auto;
  padding:2px 6px 5px 0;scrollbar-width:thin;scrollbar-color:#25e8f4 #041522;
  -webkit-overflow-scrolling:touch
}
.attendance-row{
  position:relative;min-height:70px;padding:8px 17px;display:grid;
  grid-template-columns:56px minmax(0,1fr) 48px 128px;gap:12px;align-items:center;
  border:4px solid #25e8f4;background:linear-gradient(180deg,#08233a 0%,#041a2c 100%);
  box-shadow:inset 0 0 0 2px #07566c,inset 0 -4px 0 rgba(0,0,0,.32),4px 4px 0 #010913;
  clip-path:polygon(10px 0,calc(100% - 10px) 0,100% 10px,100% calc(100% - 10px),calc(100% - 10px) 100%,10px 100%,0 calc(100% - 10px),0 10px);
  cursor:pointer;color:#fff3cf;transition:filter .08s linear,transform .08s linear
}
.attendance-row:hover{filter:brightness(1.1)}
.attendance-row:active{transform:translate(1px,1px)}
.attendance-row.is-absent{background:linear-gradient(180deg,#071d31,#061827);color:#8198a8}
.attendance-person{
  width:46px;height:48px;position:relative;color:#25e8f4;filter:drop-shadow(3px 3px 0 #012132);image-rendering:pixelated
}
.attendance-person::before{
  content:"";position:absolute;left:15px;top:1px;width:17px;height:17px;background:currentColor;
  box-shadow:-3px 3px 0 currentColor,3px 3px 0 currentColor
}
.attendance-person::after{
  content:"";position:absolute;left:9px;top:23px;width:29px;height:18px;background:currentColor;
  box-shadow:-5px 6px 0 -1px currentColor,5px 6px 0 -1px currentColor
}
.attendance-row.is-absent .attendance-person{color:#7892a4;filter:drop-shadow(2px 2px 0 #02111d)}
.attendance-name{
  min-width:0;color:inherit;font-family:var(--pixel);font-weight:900;
  font-size:clamp(.92rem,3.4vw,1.31rem);line-height:1.08;overflow-wrap:anywhere
}
.attendance-check{
  appearance:none;-webkit-appearance:none;width:42px;height:42px;min-height:42px;margin:0;padding:0;
  border:4px solid #fff4d5;background:#071421;display:grid;place-content:center;cursor:pointer;
  box-shadow:inset 0 0 0 2px #142b37,2px 2px 0 #010913
}
.attendance-check::after{
  content:"";width:13px;height:24px;border:solid #32ef45;border-width:0 7px 7px 0;
  transform:rotate(45deg) scale(0);transform-origin:center;transition:transform .05s steps(1,end);margin-top:-5px
}
.attendance-check:checked::after{transform:rotate(45deg) scale(1)}
.attendance-status{
  min-width:0;text-align:left;color:#25e8f4;font-family:var(--pixel);font-weight:900;
  font-size:clamp(.8rem,2.8vw,1.03rem);white-space:nowrap
}
.attendance-row.is-absent .attendance-status{color:#ff9b19}
.attendance-summary{
  margin-top:14px;padding:13px 20px;display:grid;grid-template-columns:1fr 4px 1fr;gap:18px;align-items:center;
  border:4px solid #25e8f4;background:linear-gradient(180deg,#082238,#041a2b);
  box-shadow:inset 0 0 0 3px #07566c,5px 5px 0 #010913;
  clip-path:polygon(10px 0,calc(100% - 10px) 0,100% 10px,100% calc(100% - 10px),calc(100% - 10px) 100%,10px 100%,0 calc(100% - 10px),0 10px);
  color:#fff3cf;font-family:var(--pixel);font-weight:900;text-align:center;font-size:clamp(.88rem,3vw,1.08rem)
}
.attendance-summary-sep{width:4px;height:48px;background:#25e8f4;justify-self:center;box-shadow:2px 0 0 #054858}
.attendance-summary strong{font-size:clamp(1.65rem,5.2vw,2.35rem);margin-left:9px;text-shadow:2px 2px 0 #010913}
.attendance-summary .present-count{color:#25ec42}
.attendance-summary .absent-count{color:#ff9b19}
.attendance-info{
  margin-top:12px;padding:11px 16px;display:grid;grid-template-columns:55px minmax(0,1fr);gap:12px;align-items:center;
  border:4px solid #25e8f4;background:linear-gradient(180deg,#082238,#041a2b);
  box-shadow:inset 0 0 0 3px #07566c,4px 4px 0 #010913;
  clip-path:polygon(10px 0,calc(100% - 10px) 0,100% 10px,100% calc(100% - 10px),calc(100% - 10px) 100%,10px 100%,0 calc(100% - 10px),0 10px);
  color:#fff3cf;font-family:var(--pixel);font-weight:900;font-size:clamp(.75rem,2.55vw,.96rem);line-height:1.32
}
.attendance-info-icon{
  width:46px;height:46px;display:grid;place-items:center;background:#25e8f4;color:#04182a;
  font-family:var(--pixel);font-size:1.38rem;font-weight:900;
  clip-path:polygon(9px 0,calc(100% - 9px) 0,100% 9px,100% calc(100% - 9px),calc(100% - 9px) 100%,9px 100%,0 calc(100% - 9px),0 9px)
}

  align-items:baseline;
  font-size:.9rem;
}
.exam-live-context-row span,
.exam-result-row span{
  color:var(--cyan);
  font-family:var(--pixel);
  font-size:.62rem;
  text-transform:uppercase;
}
.exam-live-context-row strong,
.exam-result-row strong{
  color:var(--cream);
  overflow-wrap:anywhere;
}
.exam-live-main{
  display:grid;
  grid-template-columns:minmax(240px,.85fr) minmax(280px,1.15fr);
  gap:14px;
  margin-top:14px;
}
.exam-student-panel,
.exam-timer-panel{
  border:2px solid var(--cyan-dim);
  background:#071720;
  box-shadow:5px 5px 0 #02070d;
  min-width:0;
}
.exam-student-panel{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:20px 14px 16px;
  min-height:310px;
  overflow:hidden;
}
.exam-student-panel .pixel-student{
  transform:scale(1.55);
  transform-origin:center;
  margin:30px auto 34px;
}
.exam-encourage{
  width:100%;
  border:2px solid #2a6170;
  background:#06131c;
  padding:10px;
  color:var(--cream);
  text-align:center;
  font-weight:700;
  font-style:italic;
  box-shadow:3px 3px 0 #02070d;
}
.exam-timer-panel{
  padding:18px;
  display:flex;
  flex-direction:column;
  justify-content:center;
}
.exam-timer-label{
  color:var(--cyan);
  text-align:center;
  font-family:var(--pixel);
  font-size:.72rem;
  text-transform:uppercase;
  margin-bottom:8px;
}
.exam-live-timer{
  border:3px solid var(--cyan-dim);
  background:#020a10;
  padding:16px 10px 13px;
  box-shadow:inset 0 0 0 3px #0c2530,5px 5px 0 #02070d;
}
.exam-live-timer .timer{
  font-family:var(--pixel);
  font-size:clamp(3rem,10vw,5.6rem);
  line-height:1;
  color:var(--orange2);
  text-shadow:4px 4px 0 #442810;
}
.exam-time-track{
  height:18px;
  margin-top:13px;
  border:2px solid #285b66;
  background:#041016;
  padding:2px;
}
.exam-time-progress{
  height:100%;
  width:100%;
  background:linear-gradient(90deg,var(--orange),var(--orange2));
  transition:width .45s linear;
}
.timer.over + .exam-time-track .exam-time-progress,
.exam-live-timer.is-over .exam-time-progress{
  background:var(--danger);
}
.exam-time-note{
  text-align:center;
  color:var(--muted);
  font-size:.76rem;
  margin-top:10px;
  line-height:1.4;
}
.exam-time-note.over{
  color:#ff9a8f;
  font-weight:700;
}
.exam-live-actions{
  display:grid;
  grid-template-columns:1fr;
  gap:10px;
  margin-top:14px;
}
.exam-end-button{
  width:100%;
  min-height:58px;
  border:3px solid #ff625a;
  background:#4c1718;
  color:#fff5ec;
  box-shadow:5px 5px 0 #210606;
  font-family:var(--pixel);
  font-size:.82rem;
  text-transform:uppercase;
}
.exam-end-button:hover{filter:brightness(1.1)}
.exam-live-note{
  margin-top:14px;
  border:2px solid var(--cyan-dim);
  background:#071720;
  padding:12px;
  box-shadow:4px 4px 0 #02070d;
}
.exam-live-note label{
  color:var(--cyan);
  font-family:var(--pixel);
  font-size:.66rem;
  text-transform:uppercase;
}
.exam-live-note textarea{
  margin-top:8px;
  min-height:90px;
  background:#04131b;
}
.exam-live-hint{
  display:grid;
  grid-template-columns:32px minmax(0,1fr);
  gap:10px;
  align-items:center;
  margin-top:12px;
  border:2px solid #245967;
  background:#071923;
  padding:10px 12px;
  color:var(--muted);
}
.exam-live-hint-icon{
  width:28px;height:28px;
  border:2px solid var(--cyan);
  display:grid;place-items:center;
  color:var(--cyan);
  font-family:var(--pixel);
}

/* známkování */
.grade-backdrop{
  padding:14px;
  align-items:center;
}
.grade-screen-modal{
  width:min(720px,96vw);
  max-height:94vh;
  overflow:auto;
  border:3px solid var(--cyan);
  background:#06151f;
  box-shadow:8px 8px 0 #02070d;
  padding:16px;
}
.grade-screen-head{
  text-align:center;
  border-bottom:2px solid var(--cyan-dim);
  padding-bottom:12px;
  margin-bottom:12px;
}
.grade-screen-head h2{
  margin:0;
  color:var(--cyan);
  font-family:var(--pixel);
  text-transform:uppercase;
  font-size:clamp(1.3rem,5vw,2rem);
}
.grade-context{
  border:2px solid var(--cyan-dim);
  background:#071c27;
  padding:10px 12px;
  display:grid;
  gap:4px;
  margin-bottom:14px;
}
.grade-context div{
  display:grid;
  grid-template-columns:88px minmax(0,1fr);
  gap:8px;
}
.grade-context span{
  color:var(--cyan);
  font-family:var(--pixel);
  font-size:.58rem;
  text-transform:uppercase;
}
.grade-context strong{color:var(--cream)}
.grade-picker-title{
  text-align:center;
  color:var(--cyan);
  font-family:var(--pixel);
  font-size:.76rem;
  text-transform:uppercase;
  margin:8px 0 10px;
}
.grade-picker{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:8px;
}
.grade-choice{
  min-height:70px;
  border:3px solid currentColor;
  background:#07151d;
  box-shadow:4px 4px 0 #02070d;
  font-family:var(--pixel);
  font-size:clamp(1.4rem,5vw,2.2rem);
  font-weight:900;
}
.grade-choice[data-grade="1"],.grade-choice[data-grade="2"]{color:#57dc77;background:#0a2c1b}
.grade-choice[data-grade="3"]{color:#ffd05e;background:#392a0b}
.grade-choice[data-grade="4"]{color:#ff9f43;background:#40250d}
.grade-choice[data-grade="5"]{color:#ff665f;background:#431416}
.grade-choice.is-selected{
  outline:3px solid #fff2cf;
  outline-offset:2px;
  transform:translate(2px,2px);
  box-shadow:2px 2px 0 #02070d;
}
.grade-no-grade{
  width:100%;
  margin-top:14px;
  min-height:54px;
  border:3px solid #ff665f;
  background:#451719;
  color:#fff4ed;
  font-family:var(--pixel);
  font-size:.72rem;
  text-transform:uppercase;
}
.grade-note-box{margin-top:14px}
.grade-note-box label{
  color:var(--cyan);
  font-family:var(--pixel);
  font-size:.62rem;
  text-transform:uppercase;
}
.grade-modal-actions{
  display:grid;
  grid-template-columns:1fr 1.25fr;
  gap:10px;
  margin-top:14px;
}
.grade-cancel,.grade-save{
  min-height:52px;
  border:2px solid var(--cyan-dim);
  font-family:var(--pixel);
  text-transform:uppercase;
  font-size:.68rem;
  box-shadow:4px 4px 0 #02070d;
}
.grade-cancel{background:#10212a;color:var(--cream)}
.grade-save{border-color:#53e87a;background:#143c20;color:#edfff1}
.grade-save:disabled{opacity:.4;cursor:not-allowed}

/* uložený výsledek */
.exam-result-head{
  padding-left:0;padding-right:0;
}
.exam-result-title{
  color:#58e77a;
  font-size:clamp(1.55rem,6vw,2.65rem);
}
.exam-result-icon{
  width:112px;height:112px;
  margin:14px auto 18px;
  position:relative;
  border:4px solid #d7ecff;
  background:#f5fbff;
  box-shadow:7px 7px 0 #033545;
}
.exam-result-icon::before{
  content:"✓";
  position:absolute;
  inset:0;
  display:grid;
  place-items:center;
  color:#25c95a;
  font-family:var(--pixel);
  font-size:3.4rem;
  text-shadow:3px 3px 0 #0b6830;
}
.exam-result-icon::after{
  content:"";
  position:absolute;
  inset:-14px;
  border:4px dashed #45e46c;
  animation:resultPulse 1.15s steps(2,end) infinite;
}
@keyframes resultPulse{50%{opacity:.3;transform:scale(1.08)}}
.exam-result-summary{margin-top:8px}
.exam-result-grade{
  display:inline-grid;
  place-items:center;
  min-width:42px;
  min-height:36px;
  padding:3px 8px;
  border:2px solid #57e878;
  background:#123920;
  color:#ecfff1;
  font-family:var(--pixel);
}
.exam-result-grade.no-grade{
  border-color:#ff6a61;
  background:#411516;
}
.exam-result-quote{
  margin:14px 0;
  border:2px solid var(--cyan-dim);
  padding:12px;
  text-align:center;
  color:var(--cream);
  font-style:italic;
  background:#071923;
}
.exam-result-actions{
  display:grid;
  gap:10px;
}
.exam-result-next,
.exam-result-home{
  min-height:56px;
  font-family:var(--pixel);
  font-size:.74rem;
  text-transform:uppercase;
  box-shadow:5px 5px 0 #02070d;
}
.exam-result-next{
  border:3px solid #59a8ff;
  background:#0e58a5;
  color:#fff;
}
.exam-result-home{
  border:2px solid var(--cyan);
  background:#09202c;
  color:var(--cream);
}

@media(max-width:700px){
  .exam-live-main{grid-template-columns:1fr}
  .exam-student-panel{min-height:245px}
  .exam-live-head{padding-left:4px;padding-right:4px;padding-top:48px}
  .exam-live-step{left:50%;right:auto;transform:translateX(-50%);top:5px}
  .grade-picker{gap:5px}
  .grade-choice{min-height:60px}
}
@media(max-width:420px){
  .exam-live-context-row,.exam-result-row{grid-template-columns:76px minmax(0,1fr)}
  .grade-context div{grid-template-columns:72px minmax(0,1fr)}
  .grade-modal-actions{grid-template-columns:1fr}
  .grade-screen-modal{padding:10px}
  .exam-result-icon{width:92px;height:92px}
}



/* ======================================================================

body{
  background-color:#02162a;
  background-image:
    repeating-linear-gradient(to bottom,rgba(54,223,242,.035) 0,rgba(54,223,242,.035) 1px,transparent 1px,transparent 4px),
    radial-gradient(ellipse at 50% 12%,rgba(13,80,112,.28),transparent 48%),
    linear-gradient(180deg,#031b31 0%,#02182d 52%,#011326 100%);

.home-container{width:min(941px,100%);padding:0 30px 24px}
.topbar.home-topbar{

}
.home-topbar::before{left:-5px;border-left:5px solid #20e8f3;clip-path:polygon(0 22%,28% 0,100% 0,100% 100%,0 100%)}
.home-topbar::after{right:-5px;border-right:5px solid #20e8f3;clip-path:polygon(0 0,72% 0,100% 22%,100% 100%,0 100%)}
.home-topbar .brand-lockup{gap:20px}
.home-topbar .brand-mark{width:88px;height:88px;object-fit:cover}
.home-topbar .brand-main{
  font-size:clamp(1.8rem,4.5vw,2.65rem);letter-spacing:.02em;line-height:.95;

.home-topbar .brand-code{font-size:clamp(.9rem,2.3vw,1.25rem);margin-top:9px;letter-spacing:.18em;color:#21e7f1}
.home-topbar .nav-actions{gap:18px;margin-left:auto}
.home-topbar .icon-btn{width:64px;height:64px;min-width:64px;min-height:64px;padding:0;color:#25e9f2;font-size:2.25rem}
.home-topbar .icon-btn:first-child{position:relative}
.home-topbar .icon-btn:first-child::before{content:"";position:absolute;inset:7px;background:#25e9f2;clip-path:polygon(32% 0,68% 0,80% 12%,80% 40%,100% 58%,100% 78%,0 78%,0 58%,20% 40%,20% 12%);opacity:.95}
.home-topbar .icon-btn:first-child .avatar-chip{visibility:hidden}
.home-topbar .icon-btn.account-exit{font-size:2.65rem;border-left:4px solid #25e9f2;padding-left:20px;width:82px}

.arcade-home-head{margin:58px 0 34px;text-align:center}
.arcade-home-title{
  font-family:var(--pixel);font-size:clamp(3.2rem,9.6vw,5.9rem);line-height:.9;letter-spacing:-.035em;

  text-shadow:0 5px 0 #ff4f12,0 9px 0 #b52e08,5px 10px 0 #00101e;
}
.arcade-home-title::before,.arcade-home-title::after{content:"—";color:#23e7f1;font-size:.34em;margin:0 .22em;vertical-align:.16em;text-shadow:none;font-weight:400}
.arcade-home-slogan{margin-top:24px;font-size:clamp(1rem,3.15vw,1.62rem);font-weight:900;color:#37e6f2;letter-spacing:.015em;text-shadow:0 2px 0 #06384b}
.home-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:15px 14px;margin-top:31px}
.home-card{
  min-height:188px;padding:14px 18px;grid-template-columns:172px minmax(0,1fr);gap:18px;
  border:5px solid #22e9f3;background:#031b31;
  box-shadow:inset 0 0 0 4px #07506d,inset 0 0 0 7px #02111f,0 0 0 1px #0b92a5;
}
.home-card::before{
  content:"";position:absolute;inset:6px;pointer-events:none;border:1px solid rgba(39,231,242,.18)
}
.home-card[data-action="exam"]{
  border-color:#ffe07a;background:linear-gradient(180deg,#ff9d18,#ff7410);

.home-card[data-action="exam"]::before{border-color:rgba(107,42,0,.28)}
.home-card .home-icon{height:148px;width:100%;overflow:visible}
.home-card .home-icon img{width:142px;height:142px;object-fit:contain;filter:none}
.home-card h2{
  font-size:clamp(1.38rem,3.45vw,2.05rem);line-height:1.08;font-weight:900;color:#fff4c8;letter-spacing:-.035em;

}
.home-card[data-action="exam"] h2{color:#0d1420;text-shadow:none}
.home-card .unread-pill{font-size:.62rem;vertical-align:.32em}
.home-card:hover{filter:brightness(1.06)}
.home-card:active{transform:translate(2px,2px);box-shadow:inset 0 0 0 4px #07506d,inset 0 0 0 7px #02111f}
.home-card[data-action="exam"]:active{box-shadow:inset 0 0 0 5px #ffd944,inset 0 0 0 9px #d54508}

.home-bottom-decor{
  min-height:154px;margin:34px 0 0;display:grid;grid-template-columns:190px 1fr 170px;align-items:end;gap:20px;
  border-bottom:4px solid #24e7f1;padding:0 8px 24px;position:relative;
}
.home-bottom-decor::after{content:"";position:absolute;left:198px;right:183px;bottom:23px;height:4px;background:#23e7f1}
.home-books-decor{height:125px;display:flex;align-items:end;overflow:hidden}
.home-books-decor img{width:154px;height:126px;object-fit:contain;image-rendering:pixelated;transform:translateY(6px)}
.home-motto{align-self:center;text-align:center;color:#27e6f1;font-family:var(--pixel);font-weight:900;font-size:.9rem;letter-spacing:.13em;text-transform:uppercase;white-space:nowrap}
.home-lockers-decor{height:130px;display:flex;align-items:end;justify-content:center;gap:8px}
.home-lockers-decor span{width:50px;height:112px;border:5px solid #23e7f1;background:#05283c;box-shadow:inset 0 0 0 4px #08708d;position:relative}
.home-lockers-decor span::before{content:"";position:absolute;left:8px;right:8px;top:19px;height:6px;background:#23e7f1;box-shadow:0 13px 0 #23e7f1}
.home-lockers-decor span::after{content:"";position:absolute;left:11px;bottom:12px;width:8px;height:26px;background:#23e7f1}
.home-reference-footer{margin:64px 8px 0;padding:27px 4px 18px;border-top:4px solid #23e7f1;font-size:clamp(.72rem,2vw,1rem);letter-spacing:.08em;align-items:center}
.home-reference-footer .footer-sep{margin-left:auto;width:4px;height:34px;background:#23e7f1}
.home-reference-footer span:last-child{font-size:1.05em}

@media(max-width:760px){

  .home-bottom-decor{grid-template-columns:100px 1fr 92px;min-height:105px;margin-top:22px;padding-bottom:16px;gap:8px}.home-bottom-decor::after{left:104px;right:98px;bottom:15px;height:3px}.home-books-decor{height:82px}.home-books-decor img{width:96px;height:82px}.home-lockers-decor{height:86px;gap:4px}.home-lockers-decor span{width:29px;height:76px;border-width:3px}.home-lockers-decor span::before{left:4px;right:4px;top:12px;height:4px;box-shadow:0 9px 0 #23e7f1}.home-lockers-decor span::after{left:6px;bottom:7px;width:5px;height:17px}.home-motto{font-size:.54rem;letter-spacing:.08em}
  .home-reference-footer{margin-top:35px;padding-top:18px;font-size:.64rem}
}
@media(max-width:480px){
  .home-grid{grid-template-columns:1fr}
  .home-card{min-height:112px;grid-template-columns:96px 1fr}
  .home-bottom-decor{grid-template-columns:78px 1fr 70px}.home-motto{font-size:.45rem}.home-bottom-decor::after{left:82px;right:74px}
}


/* ======================================================================
   VISUAL FIDELITY PASS H2 — KROK 1 / VÝBĚR TŘÍDY A PŘEDMĚTU
   Rekonstrukce podle schválených referencí „Výběr třídy a předmětu“
   a „Zkouškomat s rozbaleným výběrem třídy“.
   ====================================================================== */
.fidelity-h2{max-width:881px;margin:0 auto;padding:0 0 10px}
.fidelity-h2 .exam-start-head{margin:32px 0 28px;padding:0 96px 0;text-align:center}
.fidelity-h2 .exam-start-title{
  font-size:clamp(3.15rem,9.7vw,5.8rem);line-height:.88;letter-spacing:-.045em;color:#fff0b7;
  text-shadow:0 5px 0 #ff4e11,0 9px 0 #aa2a07,5px 10px 0 #00101e
}
.fidelity-h2 .exam-start-title::before,.fidelity-h2 .exam-start-title::after{font-size:.30em;margin:0 .2em;vertical-align:.18em;color:#20e7f2}
.fidelity-h2 .exam-start-subtitle{margin-top:20px;font-size:clamp(1rem,3.3vw,1.55rem);letter-spacing:.015em;color:#2ae7f0;text-shadow:0 2px 0 #06394d}
.fidelity-h2 .exam-step{right:2px;bottom:-1px;font-size:clamp(.72rem,2.2vw,1rem);letter-spacing:.04em;color:#2ae7f0}
.fidelity-h2 .exam-start-section{margin-top:24px}
.fidelity-h2 .arcade-section-label{gap:14px;margin-bottom:10px}
.fidelity-h2 .arcade-section-label img{width:118px;height:88px;object-fit:contain}
.fidelity-h2 .arcade-section-label h2{font-size:clamp(1.75rem,5.5vw,2.85rem);letter-spacing:-.03em;color:#fff1c7;text-shadow:2px 2px 0 #06283b}

/* Custom opening class dropdown matching the approved open-state mockup. */
.class-picker{position:relative;margin:0;padding:0}
.class-picker summary{list-style:none}
.class-picker summary::-webkit-details-marker{display:none}
.class-picker-summary{

/* H7.1 – živý pixelový žák: klid → nervozita → pot */
.h7-student-actor{
  width:min(230px,72vw);
  height:228px;
  margin:auto auto 6px;
  position:relative;
  image-rendering:pixelated;
  filter:drop-shadow(6px 6px 0 #02111c);
  transform-origin:center bottom;
}
.h7-student-head{
  position:absolute;left:72px;top:14px;width:82px;height:82px;
  background:#f6d3a5;border:6px solid #102532;box-shadow:inset 0 -10px 0 rgba(0,0,0,.06);
}
.h7-student-head::before,
.h7-student-head::after{
  content:"";position:absolute;top:32px;width:10px;height:10px;background:#102532;
}
.h7-student-head::before{left:18px;box-shadow:30px 0 0 #102532}
.h7-student-head::after{left:24px;top:52px;width:24px;height:6px;background:#8b4f32}
.h7-student-hair{
  position:absolute;left:66px;top:2px;width:94px;height:34px;background:#7c4d2d;
  box-shadow:0 10px 0 #7c4d2d,0 0 0 6px #102532;
}
.h7-student-body{
  position:absolute;left:57px;top:95px;width:112px;height:76px;
  background:#22dfe7;border:6px solid #103643;box-shadow:inset 0 -10px 0 rgba(0,0,0,.12);
}
.h7-student-arm{
  position:absolute;top:106px;width:26px;height:70px;background:#22dfe7;border:6px solid #103643;
}
.h7-student-arm.left{left:31px;transform:rotate(8deg)}
.h7-student-arm.right{right:31px;transform:rotate(-8deg)}
.h7-student-leg{
  position:absolute;top:171px;width:28px;height:52px;background:#d7dde0;border:6px solid #102532;
}
.h7-student-leg.left{left:69px}
.h7-student-leg.right{right:69px}
.h7-student-shoe{position:absolute;top:210px;width:40px;height:18px;background:#102532}
.h7-student-shoe.left{left:58px}
.h7-student-shoe.right{right:58px}
.h7-student-mouth{position:absolute;left:102px;top:70px;width:22px;height:6px;background:#8b4f32}
.h7-student-sweat{
  position:absolute;right:46px;top:64px;width:10px;height:18px;background:#79f6ff;border:3px solid #0a5f7f;
  opacity:0;transform:translateY(0);
}
.h7-student-sweat.drop-2{right:31px;top:86px;height:14px}
.h7-student-actor.calm .h7-student-mouth{height:5px;top:69px}
.h7-student-actor.nervous{animation:wobble .45s steps(2) infinite}
.h7-student-actor.nervous .h7-student-mouth{height:8px;top:69px;clip-path:polygon(0 100%,15% 55%,32% 85%,48% 35%,65% 80%,82% 45%,100% 100%,100% 100%,0 100%)}
.h7-student-actor.nervous .h7-student-head::before{box-shadow:30px 2px 0 #102532}
.h7-student-actor.stressed{animation:wobble .18s steps(2) infinite}
.h7-student-actor.stressed .h7-student-mouth{height:10px;top:67px;clip-path:polygon(0 0,100% 0,100% 100%,0 100%)}
.h7-student-actor.stressed .h7-student-sweat{opacity:1;animation:h7Sweat 1s steps(3,end) infinite}
.h7-student-actor.stressed .h7-student-sweat.drop-2{animation-delay:.25s}
.h7-student-actor.is-paused{animation:none!important;filter:drop-shadow(6px 6px 0 #02111c) saturate(.88)}
@keyframes h7Sweat{0%{transform:translateY(0)}100%{transform:translateY(14px)}}

  function playWheelSpinSfx(duration=2100){
    if(state.settings.sfxEnabled===false || document.hidden) return;
    stopWheelSfx();
    // Jemné cvakání s postupně delšími rozestupy — odpovídá zpomalování kola.
    let elapsed=0;
    let interval=58;
    while(elapsed < duration-170){
      const at=elapsed;
      wheelSfxTimers.push(setTimeout(()=>playSfx('wheelTick'),at));
      elapsed += interval;
      interval=Math.min(235,interval*1.105+2.5);
    }
    wheelSfxTimers.push(setTimeout(()=>playSfx('wheelLand'),Math.max(0,duration-70)));
  }

    const passes=hist.filter(h=>h.passUsed);
    const events=(state.gamification?.events||[]).filter(ev=>ev.teacherId===teacherId && Number(ev.at)>=start && Number(ev.at)<=end);
    const teacher=state.school.teachers.find(t=>t.id===teacherId)||{};
    const isCurrent=teacherId===state.user.id;
    const fallback=teacher.gameStats||{};
    return {
      completedExams:isCurrent?completed.length:Number(fallback.completedExams??teacher.examsCompleted??0),
      passesUsed:isCurrent?passes.length:Number(fallback.passesUsed??teacher.passesUsed??0),
      uniqueClasses:isCurrent?new Set(completed.map(h=>h.classId).filter(Boolean)).size:Number(fallback.uniqueClasses??Math.min(3,teacher.studentCount?1:0)),
      uniqueTopics:isCurrent?new Set(completed.map(h=>String(h.topic||'').trim().toLocaleLowerCase('cs')).filter(Boolean)).size:Number(fallback.uniqueTopics??Math.min(8,teacher.examsCompleted||0)),
      wheelSpins:isCurrent?events.filter(ev=>ev.type==='wheel_spin').length:Number(fallback.wheelSpins??0),
      lockerAppearances:isCurrent?hist.filter(h=>h.lockerAppeared).length:Number(fallback.lockerAppearances??teacher.lockerAppearances??0),
      studentCount:Number(teacher.studentCount||0)
    };
  }

  function ensureTrophyState(teacherId,trophyId){
    const all=trophyStateForTeacher(teacherId);

    all[trophyId].unlockedAt=all[trophyId].unlockedAt||{bronze:null,silver:null,gold:null,diamond:null};

  function dayKey(ts){
    const d=new Date(Number(ts)||0);
    if(Number.isNaN(d.getTime()))return '';
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  }

  function teacherTrophyStats(teacherId){
    const allHist=(state.history||[]).filter(h=>h.teacherId===teacherId);
    const completed=allHist.filter(h=>h.completed);
    const teacher=state.school.teachers.find(t=>t.id===teacherId)||{};
    const isCurrent=teacherId===state.user.id;
    const fallback=teacher.gameStats||{};
    const {start,end}=gameSeasonBounds();
    const seasonCompleted=completed.filter(h=>Number(h.at)>=start && Number(h.at)<=end);
    const allEvents=(state.gamification?.events||[]).filter(ev=>ev.teacherId===teacherId);
    const currentChallenges=(state.gamification?.challenges||[]).filter(ch=>ch.active!==false && !ch.hidden);
    const publicChallengesDone=currentChallenges.filter(ch=>challengeResult(teacherId,ch).done).length;
    const archived=(state.gamification?.archivedSeasons||[]).filter(s=>(s.ranking||[]).some(r=>r.teacherId===teacherId && Number(r.score)>0)).length;

    if(!isCurrent){
      return {
        completedExams:Number(fallback.completedExams??teacher.examsCompleted??0),
        uniqueExamDays:Number(fallback.uniqueExamDays??Math.min(Number(fallback.completedExams??teacher.examsCompleted??0),12)),
        uniqueStudentsExamined:Number(fallback.uniqueStudentsExamined??Math.min(Number(teacher.studentCount||0),Number(fallback.completedExams??teacher.examsCompleted??0))),
        gradesRecorded:Number(fallback.gradesRecorded??fallback.completedExams??teacher.examsCompleted??0),
        timerUses:Number(fallback.timerUses??fallback.completedExams??teacher.examsCompleted??0),
        examsWithNote:Number(fallback.examsWithNote??0),
        uniqueClasses:Number(fallback.uniqueClasses??0),
        uniqueTopics:Number(fallback.uniqueTopics??0),
        uniqueSubjects:Number(fallback.uniqueSubjects??Math.min(2,Number(fallback.uniqueClasses??0))),
        customTopicsUsed:Number(fallback.customTopicsUsed??0),
        wheelSpins:Number(fallback.wheelSpins??0),
        lockerAppearances:Number(fallback.lockerAppearances??teacher.lockerAppearances??0),
        passesUsed:Number(fallback.passesUsed??teacher.passesUsed??0),
        seasonExamDays:Number(fallback.seasonExamDays??Math.min(Number(fallback.completedExams??teacher.examsCompleted??0),10)),
        completedPublicChallenges:publicChallengesDone,
        completedActiveSeasons:archived
      };
    }

    return {
      completedExams:completed.length,
      uniqueExamDays:new Set(completed.map(h=>dayKey(h.at)).filter(Boolean)).size,
      uniqueStudentsExamined:new Set(completed.map(h=>h.studentId).filter(Boolean)).size,
      gradesRecorded:completed.filter(h=>Number.isFinite(Number(h.grade)) && h.grade!==null).length,
      timerUses:completed.length,
      examsWithNote:completed.filter(h=>String(h.note||'').trim()).length,
      uniqueClasses:new Set(completed.map(h=>h.classId).filter(Boolean)).size,
      uniqueTopics:new Set(completed.map(h=>String(h.topic||'').trim().toLocaleLowerCase('cs')).filter(Boolean)).size,
      uniqueSubjects:new Set(completed.map(h=>String(h.subject||'').trim().toLocaleLowerCase('cs')).filter(Boolean)).size,
      customTopicsUsed:completed.filter(h=>h.customTopicUsed).length,
      wheelSpins:allEvents.filter(ev=>ev.type==='wheel_spin').length,
      lockerAppearances:completed.filter(h=>h.lockerAppeared).length,
      passesUsed:allHist.filter(h=>h.passUsed).length,
      seasonExamDays:new Set(seasonCompleted.map(h=>dayKey(h.at)).filter(Boolean)).size,
      completedPublicChallenges:publicChallengesDone,
      completedActiveSeasons:archived
    };
  }

  function tierRequirement(def,index){
    if(def.tiers)return `${def.tiers[index]} ${trophyMetricLabel(def.metric)}`;
    const req=def.requirements?.[index]||{};
    if(def.metric==='mastery')return `${req.count} trofejí alespoň na stupni ${trophyTierDefs[Math.max(0,(req.tierRank||1)-1)]?.label||''}`;
    return Object.entries(req).map(([k,v])=>`${v} ${trophyMetricLabel(k)}`).join(' + ');
  }

  function tierSatisfied(def,index,stats,teacherId){
    if(def.tiers)return Number(stats[def.metric]||0)>=Number(def.tiers[index]||0);
    const req=def.requirements?.[index]||{};
    if(def.metric==='mastery'){
      const states=trophyStateForTeacher(teacherId);
      const rank=Number(req.tierRank||1);
      const count=trophyDefs.filter(t=>t.id!==def.id).filter(t=>Number(states[t.id]?.highestTier||0)>=rank).length;
      return count>=Number(req.count||0);
    }
    return Object.entries(req).every(([k,v])=>Number(stats[k]||0)>=Number(v||0));
  }

  function tierProgress(def,index,stats,teacherId){
    if(index<0 || index>3)return {ratio:1,text:'MAX'};
    if(def.tiers){
      const value=Number(stats[def.metric]||0), target=Number(def.tiers[index]||1);
      return {ratio:Math.min(1,value/Math.max(1,target)),text:`${value} / ${target}`};
    }
    const req=def.requirements?.[index]||{};
    if(def.metric==='mastery'){
      const states=trophyStateForTeacher(teacherId);
      const rank=Number(req.tierRank||1);
      const value=trophyDefs.filter(t=>t.id!==def.id).filter(t=>Number(states[t.id]?.highestTier||0)>=rank).length;
      return {ratio:Math.min(1,value/Math.max(1,Number(req.count||1))),text:`${value} / ${req.count}`};
    }
    const ratios=Object.entries(req).map(([k,v])=>Math.min(1,Number(stats[k]||0)/Math.max(1,Number(v||1))));
    return {ratio:ratios.length?Math.min(...ratios):0,text:Object.entries(req).map(([k,v])=>`${Number(stats[k]||0)}/${v}`).join(' · ')};
  }

  function evaluateOneTrophy(def,teacherId,stats){
    const st=ensureTrophyState(teacherId,def.id);
    const before=Number(st.highestTier||0);
    let reached=before;
    for(let i=0;i<4;i++){
      if(tierSatisfied(def,i,stats,teacherId))reached=i+1;
    }
    if(reached<=before)return null;

    const stamp=now();
    for(let level=before+1;level<=reached;level++){
      const tier=trophyTierDefs[level-1];
      if(tier && !st.unlockedAt[tier.id])st.unlockedAt[tier.id]=stamp;
    }
    st.highestTier=reached;
    return {trophy:def,tierIndex:reached-1,tier:trophyTierDefs[reached-1]};
  }

  function evaluateTrophies(teacherId){
    if(!state.gamification?.enabled)return [];
    const stats=teacherTrophyStats(teacherId);
    const unlocked=[];

    trophyDefs.filter(d=>!['trophy_showcase','master_zz01'].includes(d.id)).forEach(def=>{
      const u=evaluateOneTrophy(def,teacherId,stats); if(u)unlocked.push(u);
    });

    const states=trophyStateForTeacher(teacherId);
    stats.unlockedTierCount=trophyDefs
      .filter(d=>!['trophy_showcase','master_zz01'].includes(d.id))
      .reduce((sum,d)=>sum+Number(states[d.id]?.highestTier||0),0);

    const showcase=trophyDefs.find(d=>d.id==='trophy_showcase');
    const showcaseUnlock=evaluateOneTrophy(showcase,teacherId,stats);
    if(showcaseUnlock)unlocked.push(showcaseUnlock);

    const master=trophyDefs.find(d=>d.id==='master_zz01');
    const masterUnlock=evaluateOneTrophy(master,teacherId,stats);
    if(masterUnlock)unlocked.push(masterUnlock);

    secretTrophyDefs.forEach(def=>{
      const secret=ensureTrophyState(teacherId,def.id);
      if(def.test(stats) && Number(secret.highestTier||0)<1){
        secret.highestTier=1;
        secret.unlockedAt.bronze=now();
        unlocked.push({trophy:def,tierIndex:0,tier:trophyTierDefs[0],secret:true});
      }
    });

    return unlocked;
  }

  function migrateLegacyTrophies(){
    state.gamification.teacherTrophies=state.gamification.teacherTrophies||{};
    const map={
      first_exam:'chalk_piece',
      ten_exams:'chalk_piece',
      three_classes:'class_tourist',
      eight_topics:'repertoire',
      five_wheels:'wheel_fate',
      locker_luck:'school_locker',
      veteran:'veteran_zz01',
      secret_clean:'secret_clean'
    };

    Object.entries(state.gamification.teacherAwards||{}).forEach(([teacherId,awards])=>{
      (awards||[]).forEach(a=>{
        const trophyId=map[a.achievementId];
        if(!trophyId)return;
        const st=ensureTrophyState(teacherId,trophyId);
        if(Number(st.highestTier||0)<1){
          st.highestTier=1;
          st.unlockedAt.bronze=Number(a.at)||now();
        }
      });
    });

    state.gamification.trophySchemaVersion=2;
    state.school.teachers.filter(t=>t.active!==false).forEach(t=>evaluateTrophies(t.id));
  }

    const target=(state.school.teachers||[]).find(t=>t.id===teacherId && t.active!==false);

    // Uložíme případné změny profilu právě používaného účtu.
    syncCurrentTeacherProfile();

    const leavingTestBoss=state.user.id==='test_boss' && teacherId!=='test_boss';
    if(leavingTestBoss && Object.prototype.hasOwnProperty.call(state.ui||{},'testPreviousBossTeacherId')){
      state.school.bossTeacherId=state.ui.testPreviousBossTeacherId||null;
      delete state.ui.testPreviousBossTeacherId;

    if(teacherId==='test_boss' && state.user.id!=='test_boss'){
      state.ui=state.ui||{};
      state.ui.testPreviousBossTeacherId=state.school.bossTeacherId||'';
      state.school.bossTeacherId='test_boss';
    }

    state.user={
      ...state.user,
      id:target.id,
      name:target.name,
      nickname:target.nickname||'',
      avatar:target.avatar||'px:cyan',
      role:target.role||'teacher',
      schoolId:state.school.id

    state.activeExam=null;

      const points=Math.trunc(Number(document.getElementById('boss-points')?.value||0));
      if(!teacherId)return toast('Vyber učitele.','error');
      if(teacherId===state.user.id)return toast('Šéfová nemůže přidělovat body sama sobě.','error');
      if(!reason)return toast('Napiš důvod přidělení bodů.','error');
      if(points===0)return toast('Počet bodů nesmí být 0.','error');
      if(Math.abs(points)>limit)return toast(`Maximum na jednu událost je ±${limit} bodů.`,'error');

      state.gamification.bossAdjustments=state.gamification.bossAdjustments||[];
      state.gamification.bossAdjustments.push({
        id:uid('bosspts'),teacherId,bossId:state.user.id,at:now(),points,reason,
        seasonId:state.gamification.season.id,reversalOf:null,reversedById:null
      });
      saveState();
      toast(points>0?`Učiteli přidáno +${points} bodů.`:`Učiteli odebráno ${Math.abs(points)} bodů.`);

      // bezpečně dokončil a nový modal dostal vlastní čerstvé handlery.
      setTimeout(()=>showBossPointsManager(),0);

        title:'Stornovat bodový zásah?',
        body:`<p>Storno vytvoří nový opačný záznam. Původní událost zůstane v historii.</p><p><strong>${esc(original.reason)}</strong> · ${Number(original.points)>0?'+':''}${Number(original.points)} b.</p>`,

            const reversal={

              points:-Number(original.points||0),reason:`STORNO: ${original.reason}`,

  function trophyBranchHtml(def,teacherId){
    const stats=teacherTrophyStats(teacherId);
    const st=ensureTrophyState(teacherId,def.id);
    const highest=Number(st.highestTier||0);
    const nextIndex=highest<4?highest:3;
    const prog=highest>=4?{ratio:1,text:'DIAMANT DOKONČEN'}:tierProgress(def,nextIndex,stats,teacherId);
    const rarity=rarityInfo(def.rarity);

    return `<div class="trophy-branch rarity-${def.rarity}">
      <div class="trophy-branch-head">
        <div class="trophy-tree-icon trophy-tier-material ${highest?trophyTierDefs[highest-1].id:''}">${esc(def.icon)}</div>

        ${trophyTierDefs.map((tier,i)=>{
          const done=highest>=i+1;

          return `<div class="trophy-tier-node ${done?'done':''} ${next?'next':''}">
            <div class="trophy-tier-dot trophy-tier-material ${tier.id}">${done?'✓':tier.short}</div>

          ? `<strong>DIAMANT DOKONČEN · MAX</strong>`

  function resizeAvatarFile(file,done){
    if(!file || !String(file.type||'').startsWith('image/')){
      toast('Vyber obrázek.','error'); return;
    }
    if(file.size>6*1024*1024){
      toast('Obrázek je příliš velký. Maximum je 6 MB.','error'); return;
    }
    const reader=new FileReader();
    reader.onerror=()=>toast('Obrázek se nepodařilo načíst.','error');
    reader.onload=()=>{
      const img=new Image();
      img.onerror=()=>toast('Obrázek se nepodařilo zpracovat.','error');
      img.onload=()=>{
        const side=Math.min(img.width,img.height);
        const sx=(img.width-side)/2;
        const sy=(img.height-side)/2;
        const canvas=document.createElement('canvas');
        canvas.width=160;canvas.height=160;
        const ctx=canvas.getContext('2d');
        ctx.imageSmoothingEnabled=true;
        ctx.drawImage(img,sx,sy,side,side,0,0,160,160);
        const data=canvas.toDataURL('image/jpeg',0.82);
        done(data);
      };
      img.src=reader.result;
    };
    reader.readAsDataURL(file);
  }

  function handleBackNavigation(){
    if(state.route==='exam' && state.examFlow){
      const f=state.examFlow;
      if(f.stage==='exam' && state.activeExam){
        return modal({
          title:'Zpět během zkoušení',
          body:'<p>Zkoušení už běží. Pokud chceš opustit tuto obrazovku, můžeš se vrátit do hlavního menu a časovač poběží dál na pozadí.</p>',
          actions:[
            {label:'Zůstat u zkoušení',className:'secondary'},
            {label:'Hlavní menu',className:'primary',onClick:()=>{state.route='home';saveState();renderHome();}}
          ]
        });
      }
      const previous={
        attendance:'select',
        rules:'attendance',
        candidates:'attendance',
        question:'candidates'
      }[f.stage];

      if(previous){
        f.stage=previous;
        saveState();
        return render();
      }

      // První krok přípravy zkoušení → zpět do hlavního menu.
      state.examFlow=null;
      state.route='home';
      saveState();
      return render();
    }

    if(state.route==='class-detail'){
      state.route='classes';
      saveState();
      return render();
    }
    if(state.route==='subject-detail'){
      state.route='subjects';
      saveState();
      return render();
    }

    // Jednoúrovňové obrazovky se vracejí do hlavního menu.
    if(['classes','subjects','grades','scoring','history','wheel','settings','admin','help','staffroom','exam-result'].includes(state.route)){
      state.route='home';
      saveState();
      return render();
    }

    state.route='home';
    saveState();
    render();
  }

  function staffroomEnsure(){
    state.staffroom=state.staffroom||{messages:[],lastReadBy:{},notificationsBy:{}};
    if(!Array.isArray(state.staffroom.messages))state.staffroom.messages=[];
    if(!state.staffroom.lastReadBy || typeof state.staffroom.lastReadBy!=='object')state.staffroom.lastReadBy={};
    if(!state.staffroom.notificationsBy || typeof state.staffroom.notificationsBy!=='object')state.staffroom.notificationsBy={};
    return state.staffroom;
  }

  function staffroomNotificationEnabled(userId=state.user.id){
    const room=staffroomEnsure();
    return room.notificationsBy[userId]===true;
  }

  function staffroomUnreadCount(){
    const room=staffroomEnsure();
    const lastRead=Number(room.lastReadBy[state.user.id]||0);
    return room.messages.filter(m=>m.senderId!==state.user.id && Number(m.at||0)>lastRead).length;
  }

  function staffroomTime(ts){
    try{
      return new Date(Number(ts)||Date.now()).toLocaleString('cs-CZ',{
        day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'
      });
    }catch(_){return '';}
  }

  function staffroomTeacher(id){
    return (state.school.teachers||[]).find(t=>t.id===id)||null;
  }

  function staffroomNotificationStatusText(){
    const enabled=staffroomNotificationEnabled();
    if(!enabled)return 'Mobilní upozornění jsou vypnutá.';
    if(!('Notification' in window))return 'Upozornění jsou zapnutá jako preference, ale tento prohlížeč systémové notifikace nepodporuje.';
    if(Notification.permission==='granted'){
      return location.protocol==='file:'
        ? 'Systémová oprávnění jsou povolena. V offline HTML ale nelze přijímat zprávy ze školy při zavřené aplikaci.'
        : 'Systémová oprávnění jsou povolena. Plný push po zavření aplikace vyžaduje online/PWA verzi se serverem.';
    }
    if(Notification.permission==='denied')return 'Prohlížeč systémové notifikace zablokoval. Lze je povolit v nastavení webu/prohlížeče.';
    return 'Po zapnutí může prohlížeč požádat o oprávnění k notifikacím.';
  }

  function setStaffroomNotifications(enable){
    const room=staffroomEnsure();
    room.notificationsBy[state.user.id]=!!enable;
    saveState();

    if(!enable){
      toast('Upozornění ze Sborovny vypnuta.');
      return Promise.resolve(false);
    }

    if(!('Notification' in window)){
      toast('Preference uložena. Skutečný mobilní push bude dostupný až v online/PWA verzi.','warn');
      return Promise.resolve(false);
    }

    if(Notification.permission==='granted'){
      toast('Upozornění ze Sborovny zapnuta.');
      return Promise.resolve(true);
    }

    if(Notification.permission==='denied'){
      toast('Notifikace jsou v prohlížeči zablokované.','warn');
      return Promise.resolve(false);
    }

    return Notification.requestPermission().then(p=>{
      saveState();
      toast(
        p==='granted'
          ? 'Upozornění povolena. Plný push při zavřené aplikaci bude fungovat až v online/PWA verzi.'
          : 'Upozornění nebyla povolena.',
        p==='granted'?'':'warn'
      );
      return p==='granted';
    }).catch(()=>false);
  }

  }

  function sendStaffroomMessage(){
    const input=document.getElementById('staffroom-input');
    if(!input)return;
    const message=String(input.value||'').trim();
    if(!message)return toast('Napiš zprávu.','warn');
    if(message.length>1000)return toast('Zpráva je příliš dlouhá.','error');

    const room=staffroomEnsure();
    const me=(state.school.teachers||[]).find(t=>t.id===state.user.id);
    room.messages.push({
      id:uid('msg'),
      senderId:state.user.id,
      senderName:state.user.nickname||state.user.name,
      senderAvatar:state.user.avatar||me?.avatar||'px:cyan',
      text:message,
      at:now()
    });
    if(room.messages.length>300)room.messages=room.messages.slice(-300);
    room.lastReadBy[state.user.id]=now();
    saveState();
    renderStaffroom();
  }

  function renderHomeSchoolOverview(){
    const teachers=(state.school.teachers||[])
      .filter(t=>t.active!==false)
      .slice()
      .sort((a,b)=>teacherGameScore(b)-teacherGameScore(a));

    const teacherRows=teachers.slice(0,3).map((t,i)=>`
      <div class="home-teacher-row">
        <div class="home-rank">${i+1}.</div>
        ${avatarMarkup(t.avatar,'sm')}
        <div>
          <div class="student-name">${esc(t.nickname||t.name)}</div>
          <div class="tiny muted">${i===0?'Aktuální lídr školy':'Scoring učitelů'}</div>
        </div>
        <div class="home-score">${teacherGameScore(t).toFixed(1)} b.</div>
      </div>`).join('');

    const myIndex=teachers.findIndex(t=>t.id===state.user.id);
    const myTeacher=teachers[myIndex];
    const myLine=myTeacher
      ? `<div class="tiny muted" style="margin-top:9px">Tvoje pozice: <strong>${myIndex+1}. místo</strong> · ${teacherGameScore(myTeacher).toFixed(1)} b.</div>`
      : '';

    const worst=state.students.slice().sort((a,b)=>
      (Number(b.collectedPoints||0)-Number(a.collectedPoints||0)) ||
      (currentPoints(b)-currentPoints(a)) ||
      String(a.name||'').localeCompare(String(b.name||''),'cs')
    )[0];

    let studentCard='';
    if(worst){
      const classes=classesForStudent(worst.id)||[];
      const cls=classes.find(c=>c.schoolYear===state.school.schoolYear)||classes[0];
      const classLabel=cls
        ? `${esc(cls.displayName)} — ${esc(cls.schoolYear||'')}`
        : 'Bez přiřazené třídy';

      studentCard=`<div class="home-student-alert">
        <div class="home-student-icon">!</div>
        <div>
          <div class="tiny muted">NEJVÍCE TRESTNÝCH BODŮ VE ŠKOLE</div>
          <div class="home-student-name">${esc(worst.name)}</div>
          <div class="meta">${classLabel}</div>
          <div class="home-points-big">${Number(worst.collectedPoints||0)} nasbíraných b.</div>
          <div class="tiny muted">Aktuálně: ${currentPoints(worst)} b.</div>
        </div>
      </div>`;
    }else{
      studentCard='<div class="empty">Ve škole zatím nejsou žádní žáci.</div>';
    }

    return `<div class="home-summary-grid">
      <section class="pixel-frame home-summary-card">
        <div class="home-summary-title">
          <h3>SCORING UČITELŮ</h3>
          <button class="btn secondary" data-action="scoring">Celý přehled</button>
        </div>
        ${teacherRows||'<div class="empty">Zatím nejsou žádní učitelé ve scoringu.</div>'}
        ${myLine}
      </section>

      <section class="pixel-frame home-summary-card">
        <div class="home-summary-title"><h3>ŽÁK – ŠKOLNÍ PŘEHLED</h3></div>
        ${studentCard}
      </section>
    </div>`;
  }

  function homeCard(action,icon,title,desc,unread=0){
    const asset={
      exam:'home-exam.png',wheel:'home-wheel.png',classes:'home-classes.png',subjects:'home-subjects.png',
      grades:'home-grades.png',scoring:'home-scoring.png',staffroom:'home-staffroom.png',help:'home-help.png'

    return `<button class="home-card" data-action="${action}" aria-label="${esc(title)}">
      <div class="home-icon">${asset?`<img src="assets/ui/${asset}" alt="" aria-hidden="true">`:icon}</div>
      <div><h2>${esc(title)}${Number(unread)>0?`<span class="unread-pill">${Math.min(99,Number(unread))}</span>`:''}</h2><div class="home-card-desc">${esc(desc)}</div></div>

  function startExamFlow(){
    const myClasses=classesForCurrentTeacher();
    state.examFlow={stage:'select',classId:myClasses[0]?.id||'',subject:'',attendance:{},selectedStudentId:null,candidateChoiceId:null,candidates:[],topic:'',lockerAppeared:false,lockerResult:null,ignoreProtection:false};
    state.route='exam'; saveState(); render();
  }

  function renderExamFlow(){
    const f=state.examFlow||{stage:'select'};
    if(f.stage==='select') return renderExamSelect(f);
    if(f.stage==='attendance') return renderAttendance(f);
    if(f.stage==='rules') return renderExamRules(f);
    if(f.stage==='candidates') return renderCandidates(f);
    if(f.stage==='question') return renderQuestionStep(f);
    if(f.stage==='exam') return renderActiveExam();
    return renderExamSelect(f);
  }

    const subjectOptions=subjectGroups.all.map(s=>`<option value="${esc(s)}" ${f.subject===s?'selected':''}>${esc(s)}</option>`).join('');

    const choices=subjectGroups.all.map(s=>`
      <button type="button" class="arcade-subject-choice ${f.subject===s?'selected':''}" data-action="exam-subject-choice" data-subject="${esc(s)}" aria-pressed="${f.subject===s?'true':'false'}">

  function renderAttendance(f){
    const list=studentsForClass(f.classId);
    const c=classById(f.classId);
    const rules=activeRules();
    const presentCount=list.filter(s=>f.attendance[s.id]!==false).length;
    const absentCount=Math.max(0,list.length-presentCount);
    const classLabel=c?`${esc(c.displayName)} · ${esc(c.schoolYear)}`:'Třída';
    const subjectLabel=f.subject?esc(f.subject):'Bez vybraného předmětu';

    if(state.ui.ruleOpenStudentId && !list.some(s=>s.id===state.ui.ruleOpenStudentId)) state.ui.ruleOpenStudentId='';

    const pointText=n=>{
      n=Number(n)||0;
      return `${n} ${n===1?'bod':(n>=2&&n<=4?'body':'bodů')}`;
    };

    const rows=list.map(s=>{
      const present=f.attendance[s.id]!==false;
      const points=currentPoints(s);
      const open=state.ui.ruleOpenStudentId===s.id && present;
      const ruleRows=open?rules.map(r=>{
        const on=!!s.ruleStates[r.id];
        return `<div class="exam-roster-rule-chip">
          <button type="button" class="rules-inline-toggle ${on?'on':''}" data-action="exam-inline-rule-toggle" data-student="${s.id}" data-rule="${r.id}" aria-pressed="${on?'true':'false'}" aria-label="${on?'Vypnout':'Zapnout'} ${esc(r.name)}">${on?'✓':''}</button>
          <div class="rules-inline-name">${esc(r.name)}</div>
          <div class="rules-inline-points">+${Number(r.points)||0}</div>
        </div>`;
      }).join(''):'';
      return `<article class="exam-roster-item ${present?'is-present':'is-absent'}" data-roster-student="${s.id}">
        <div class="exam-roster-row-main">
          <div class="exam-roster-name"><span>${esc(s.name)}</span></div>
          <label class="exam-roster-presence"><input class="attendance-check" type="checkbox" data-attendance="${s.id}" ${present?'checked':''} aria-label="${present?'Přítomen':'Chybí'} – ${esc(s.name)}"><span class="roster-presence-label">${present?'Přítomen':'Chybí'}</span></label>
          <div class="exam-roster-points ${points>0?'has-points':''}">${pointText(points)}</div>
          <button type="button" class="exam-roster-rules-btn ${open?'is-open':''}" data-action="exam-rule-student-toggle" data-id="${s.id}" ${present?'':'disabled'}>${open?'Zavřít':'Pravidla'}</button>
        </div>
        ${open?`<div class="exam-roster-rule-panel"><div class="exam-roster-rule-list">${ruleRows||'<div class="rules-empty">Nejsou aktivní žádná pravidla.</div>'}</div></div>`:''}
      </article>`;

    const body=`

          <strong>${classLabel}</strong><span>· ${subjectLabel}</span>
          <div class="exam-roster-summary" aria-live="polite"><span>Přítomní <b id="roster-present-count" class="present">${presentCount}</b></span><span>Chybí <b id="roster-absent-count" class="absent">${absentCount}</b></span></div>

          ${rows}

        </div>

      </section>`;

  function renderExamRules(f){
    const students=studentsForClass(f.classId).filter(s=>f.attendance[s.id]!==false);
    const filter=state.ui.onlyPoints===true;
    const visible=filter?students.filter(s=>currentPoints(s)>0):students;
    const studentsWithPoints=students.filter(s=>currentPoints(s)>0).length;
    const c=classById(f.classId);
    const classLabel=c?`${esc(c.displayName)} · ${esc(c.schoolYear)}`:'Třída';
    const subjectLabel=f.subject?esc(f.subject):'Bez vybraného předmětu';

  function weightedCandidates(f,ignoreProtection=false){
    let eligible=studentsForClass(f.classId).filter(s=>f.attendance[s.id]!==false);
    if(!ignoreProtection) eligible=eligible.filter(s=>!isProtected(s));
    if(!eligible.length) return [];
    const points=eligible.map(currentPoints);
    const same=points.every(p=>p===points[0]);
    const pool=eligible.map(s=>({s,w:same?1:1+currentPoints(s)}));
    const picks=[];
    while(pool.length && picks.length<3){
      const total=pool.reduce((a,x)=>a+x.w,0);
      let r=Math.random()*total,idx=0;
      for(let i=0;i<pool.length;i++){ r-=pool[i].w; if(r<=0){idx=i;break;} }
      picks.push(pool[idx].s.id); pool.splice(idx,1);
    }
    return picks;
  }

  function maybeLocker(id){
    if(!state.settings.lockersEnabled){ return goQuestion(id); }
    const activeLockers=lockerItems().filter(x=>x.active!==false);
    if(!activeLockers.length){ return goQuestion(id); }

    const appeared=Math.random()*100 < state.settings.lockerProbability;
    state.examFlow.lockerAppeared=appeared;
    if(!appeared) return goQuestion(id);

    const s=studentById(id);
    const item=activeLockers[Math.floor(Math.random()*activeLockers.length)];
    state.examFlow.lockerResult=item.id;
    state.examFlow.lockerResultName=item.name;
    state.examFlow.lockerPointsDelta=0;

    let effectText='Bez bodové změny.';
    if(item.kind==='pass'){
      s.passCount++;
      effectText='Skříňka přidělila propustku.';
    }else if(item.kind==='nothing'){
      effectText='Skříňka je dnes prázdná.';
    }else{
      const result=applyLockerPoints(s,Number(item.points||0));
      state.examFlow.lockerPointsDelta=result.applied;
      if(result.applied>0) effectText=`Přidáno +${result.applied} aktuálních trestných bodů.`;
      else if(result.applied<0) effectText=`Ubráno ${Math.abs(result.applied)} aktuálních trestných bodů.`;
      else if(Number(item.points||0)<0) effectText='Body už nešlo snížit – žák je na nule.';
      else effectText='Počet bodů se nezměnil.';
    }

    saveState();
    playSfx('locker');
    modal({
      title:'Školní skříňka',
      body:`${lockerVisualHtml(item,effectText)}${item.kind==='pass'?'<p>Novou propustku lze použít hned nebo si ji nechat na později.</p>':''}`,
      actions:[

            saveState();render();
          }
        }]:[]),
        {label:'Pokračovat',className:'secondary',onClick:()=>goQuestion(id)}
      ]
    });
  }

      const step=steps[i];

        examCountdownRunning=false;
        beginExam(topic);
        return;
      }
      if(value){
        value.src=examCountdownAssets[step.label];

        value.classList.remove('pop');

        value.classList.add('pop');

      i+=1;
      setTimeout(runStep,step.ms);
    };
    runStep();
  }

  // EXAM F: presentation only. Never changes grades, student data or timer state.
  const examSceneImages=new Map();
  let examSceneMemory={id:null,scene:null};
  function preloadExamScenes(){
    if(examSceneImages.size)return;
    for(const [key,src] of Object.entries(examSceneFrames)){
      const image=new Image();
      examSceneImages.set(key,image);
      image.src=src;
    }
  }
  function pickExamScene(rem,total){
    const ratio=Math.max(0,Math.min(1,rem/total));
    const elapsed=Math.max(0,total-rem);
    if(rem<=0){
      const overtime=-rem;
      const scene=overtime<2500?'dismiss':overtime<5000?'to-seat':
        overtime<10000?'seated':overtime<14000?'return':
        overtime<20000?'plead':overtime<23000?'lift':'exit';
      return {scene,phase:overtime<10000?'timeup':'overtime',
        label:overtime<10000?'ČAS VYPRŠEL':'PŘESČAS!'};
    }
    // Writing is shown once, rather than erasing and rewriting the equation.
    if(ratio>.72){
      return {scene:elapsed<1800?'coffee':elapsed<3600?'nod':'written',
        phase:'calm',label:'JEŠTĚ JE ČAS'};
    }
    if(ratio>.42){
      const t=Math.max(0,elapsed-total*.28)%24000;
      const scene=t<2000?'stand':t<3500?'walk':t<7000?'explain':
        t<10500?'point':t<12000?'walk':'written';
      return {scene,phase:'working',label:t<12000?'UČITEL VYSVĚTLUJE':'JEŠTĚ JE ČAS'};
    }
    if(ratio>.18)return {scene:'hesitate',phase:'nervous',label:'ČAS BĚŽÍ'};
    return {scene:'sweat',phase:'stressed',label:'POSLEDNÍ CHVÍLE!'};
  }
  function updateExamClassroomScene(rem,paused=false){
    if(!state.activeExam)return;
    const stage=document.getElementById('exam-classroom-stage');
    const frame=document.getElementById('exam-scene-frame');
    const status=document.getElementById('exam-scene-status');
    if(!stage||!frame)return;
    preloadExamScenes();
    if(examSceneMemory.id!==state.activeExam.id){
      examSceneMemory={id:state.activeExam.id,scene:null};
    }
    const next=pickExamScene(rem,examTotalMs());
    const scene=paused && examSceneMemory.scene?examSceneMemory.scene:next.scene;
    const image=examSceneImages.get(scene);
    // Keep the last visible frame while the next asset downloads (or if it fails).
    if(image?.complete && image.naturalWidth>0){
      const src=examSceneFrames[scene];
      if(frame.getAttribute('src')!==src)frame.setAttribute('src',src);
      examSceneMemory.scene=scene;
    }else if(paused && examSceneMemory.scene){
      frame.setAttribute('src',examSceneFrames[examSceneMemory.scene]);
    }
    stage.dataset.phase=paused?'paused':next.phase;
    stage.dataset.scene=examSceneMemory.scene||'coffee';
    if(status)status.textContent=paused?'PAUZA':next.label;
  }

  function examTotalMs(){
    if(!state.activeExam)return 0;
    return Math.max(1,Number(state.activeExam.timerTotalMs||state.activeExam.durationMs||1));
  }

  function startTimerLoop(){
    clearInterval(timerTick);
    if(!state.activeExam) return;
    timerTick=setInterval(()=>{
      if(!state.activeExam){clearInterval(timerTick);return;}
      const el=document.getElementById('exam-timer');
      if(!el) return;
      const rem=remainingMs();
      const ratio=Math.max(0,Math.min(1,rem/examTotalMs()));
      const paused=state.activeExam.paused===true;
      el.textContent=formatDuration(rem);
      const sceneClock=document.getElementById('exam-scene-clock');
      if(sceneClock)sceneClock.textContent=formatDuration(rem);
      el.classList.toggle('over',rem<=0);
      el.classList.toggle('paused',paused);
      const progress=document.getElementById('exam-time-progress');
      if(progress)progress.style.width=`${Math.round(ratio*100)}%`;
      const timerBox=el.closest('.exam-live-timer');
      if(timerBox){
        timerBox.classList.toggle('is-over',rem<=0);
        timerBox.classList.toggle('is-paused',paused);
      }
      const quote=document.getElementById('exam-encourage');
      if(quote){
        quote.textContent=paused?'„Zkoušení je pozastavené.“':rem<=0?'„Čas vypršel – pokračujte podle potřeby.“':ratio<.2?'„Už jen kousek.“':ratio<.55?'„Klid, to dáš!“':'„Jdeme na to!“';
      }
      updateExamClassroomScene(rem,paused);
      if(rem<=0 && !paused && !state.activeExam.notified){
        state.activeExam.notified=true; saveState();
        toast('Čas zkoušení vypršel.','warn');
        sendTimerNotification();
      }
    },500);
  }

  function remainingMs(){
    const e=state.activeExam;
    if(!e)return 0;
    if(e.paused===true && Number.isFinite(Number(e.pausedRemainingMs))) return Number(e.pausedRemainingMs);
    if(Number.isFinite(Number(e.timerEndsAt))) return Number(e.timerEndsAt)-now();
    return Number(e.durationMs||0)-(now()-Number(e.startedAt||now()));
  }

  function formatDuration(ms){
    const over=ms<0, t=Math.abs(ms);
    const m=Math.floor(t/60000), sec=Math.floor((t%60000)/1000);
    return `${over?'+':''}${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;
  }

      const bossControl=isBossUser()
        ? `<div class="boss-panel"><div class="section-title"><div><h3 style="margin:0">Šéfová – ruční body</h3><div class="tiny muted">Body za školní události, které nejsou navázané na zkoušení.</div></div><button class="btn primary" data-action="boss-points-manager">Přidělit / odebrat body</button></div></div>`
