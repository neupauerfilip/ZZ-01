<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#07121f" />
  <meta name="description" content="Zkouškomat ZZ-01 MVP v0.4 – hravý pomocník pro ústní zkoušení." />
  <link rel="manifest" href="assets/icons/manifest.webmanifest" />
  <link rel="icon" href="assets/icons/Zkouskomat_APP_ICON_favicon.ico" />
  <link rel="apple-touch-icon" href="assets/icons/Zkouskomat_APP_ICON_AppleTouch_180.png" />
  <style>
:root{
  --bg:#07121f;
  --bg2:#0b1b2b;
  --panel:#0d2632;
  --panel2:#102f3d;
  --cyan:#4fe0db;
  --cyan-dim:#2f8f8b;
  --orange:#ff9d36;
  --orange2:#ffbf68;
  --cream:#f3ead2;
  --muted:#9bb8bd;
  --danger:#ff6d5f;
  --ok:#7bd88f;
  --shadow:#02070d;
  --focus:#fff0a0;
  --radius:4px;
  --tap:48px;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--cream);font-family:"Courier New",monospace}
body{min-height:100vh;overflow-x:hidden}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.crt-overlay{position:fixed;inset:0;pointer-events:none;z-index:9999;opacity:.18;background:repeating-linear-gradient(to bottom,rgba(255,255,255,.06),rgba(255,255,255,.06) 1px,transparent 1px,transparent 4px),radial-gradient(circle at center,transparent 45%,rgba(0,0,0,.45) 100%)}
.app-shell{min-height:100vh;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.pixel-frame{border:3px solid var(--cyan);box-shadow:0 0 0 2px #12313c,8px 8px 0 var(--shadow);background:linear-gradient(180deg,rgba(18,47,61,.97),rgba(7,18,31,.98));border-radius:var(--radius)}
.pixel-inset{border:2px solid var(--cyan-dim);background:#071823;box-shadow:inset 0 0 0 2px #031018}
.pixel-title{letter-spacing:.08em;text-transform:uppercase;text-shadow:3px 3px 0 #1b5554,5px 5px 0 #041014;margin:0}
.accent{color:var(--orange)}
.muted{color:var(--muted)}
.small{font-size:.84rem}
.tiny{font-size:.72rem}
.hidden{display:none!important}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:12px}
.grid{display:grid;gap:14px}
.grid-2{grid-template-columns:repeat(2,minmax(0,1fr))}
.grid-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.container{width:min(1180px,100%);margin:0 auto;padding:16px}
.topbar{position:sticky;top:0;z-index:40;background:rgba(7,18,31,.94);backdrop-filter:blur(6px);border-bottom:2px solid var(--cyan-dim);padding:10px 14px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-weight:700;letter-spacing:.08em}
.context-strip{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:.78rem;color:var(--muted)}
.badge{display:inline-flex;align-items:center;gap:6px;min-height:30px;padding:4px 9px;border:1px solid var(--cyan-dim);background:#08202b;color:var(--cream)}
.nav-actions{display:flex;gap:8px;align-items:center}
.icon-btn,.btn{min-height:var(--tap);border:2px solid var(--cyan);background:#0a2230;color:var(--cream);padding:10px 14px;box-shadow:4px 4px 0 var(--shadow);text-transform:uppercase;font-weight:700;letter-spacing:.04em}
.icon-btn{min-width:var(--tap);padding:8px 10px}
.icon-btn.account-exit{border-color:var(--orange);color:var(--orange);background:#20170f}
.back-nav-btn{min-height:var(--tap);padding:8px 12px;border-color:var(--orange2);color:var(--cream);background:#17202a;white-space:nowrap}
.back-nav-btn .back-arrow{color:var(--orange2);font-size:1.15em;margin-right:5px}
.btn:hover,.icon-btn:hover{filter:brightness(1.12)}
.btn:active,.icon-btn:active{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--shadow)}
.btn.primary{border-color:var(--orange);background:#4c2d12;color:#fff3df}
.btn.secondary{border-color:var(--cyan);background:#0a2834}
.btn.ghost{background:transparent;border-color:#325963;color:var(--muted)}
.btn.danger{border-color:var(--danger);background:#4a1c1b}
.btn.success{border-color:var(--ok);background:#15351f}
.btn.full{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:2px 2px 0 var(--shadow)}
.card{padding:16px}
.card h2,.card h3{margin-top:0}
.home-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.home-card{min-height:150px;display:flex;flex-direction:column;justify-content:space-between;padding:18px;position:relative;overflow:hidden}
.home-card::after{content:"";position:absolute;right:-24px;bottom:-24px;width:90px;height:90px;border:3px solid var(--cyan-dim);transform:rotate(45deg);opacity:.25}
.home-card h2{font-size:1.18rem;margin:0 0 10px}
.home-card .home-icon{font-size:2rem;filter:saturate(.8)}
.home-summary-grid{
  display:grid;
  grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);
  gap:14px;
  margin-top:18px;
}
.home-summary-card{min-width:0;padding:14px}
.home-summary-title{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin-bottom:10px;
}
.home-summary-title h3{
  margin:0;
  font-family:var(--pixel);
  font-size:.9rem;
  color:var(--cream);
}
.home-teacher-row{
  display:grid;
  grid-template-columns:32px 32px minmax(0,1fr) auto;
  gap:9px;
  align-items:center;
  padding:8px 0;
  border-bottom:1px dashed rgba(255,255,255,.12);
}
.home-teacher-row:last-child{border-bottom:0}
.home-rank{color:var(--orange);font-family:var(--pixel);text-align:center}
.home-score{white-space:nowrap;color:var(--cyan);font-family:var(--pixel);font-size:.78rem}
.home-student-alert{
  display:grid;
  grid-template-columns:auto minmax(0,1fr);
  gap:12px;
  align-items:center;
}
.home-student-icon{
  width:58px;height:58px;display:grid;place-items:center;
  border:3px solid var(--orange);background:#171e27;
  font-family:var(--pixel);color:var(--orange);font-size:1.4rem;
  box-shadow:4px 4px 0 #02070d;
}
.home-student-name{font-size:1.08rem;font-weight:700;overflow-wrap:anywhere}
.home-points-big{margin-top:7px;font-family:var(--pixel);color:var(--orange);font-size:1.05rem}
@media(max-width:700px){.home-summary-grid{grid-template-columns:1fr}}

.section-title{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:16px 0}
.section-title h1{margin:0;font-size:clamp(1.3rem,4vw,2rem)}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
label{display:flex;flex-direction:column;gap:7px;font-size:.9rem;color:var(--muted)}
input,select,textarea{width:100%;min-height:44px;border:2px solid #2d6470;background:#06151f;color:var(--cream);padding:10px;border-radius:0}
textarea{min-height:90px;resize:vertical}
.check-row{display:flex;align-items:center;gap:10px;min-height:48px}
.check-row input[type=checkbox]{width:22px;height:22px;min-height:0;accent-color:var(--orange)}
.list{display:flex;flex-direction:column;gap:8px;max-height:min(58vh,560px);overflow:auto;padding-right:4px;scrollbar-color:var(--cyan-dim) #081720;scrollbar-width:thin}
.list-item{border:2px solid #245967;background:#081a24;padding:12px;display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:58px}
.list-item.active{border-color:var(--orange);background:#2a1d13}
.existing-student-row{width:100%;text-align:left;color:inherit;font:inherit;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.existing-student-row[aria-pressed="true"]{border-color:var(--orange);background:#2a1d13;box-shadow:inset 0 0 0 1px var(--orange2)}
.existing-student-row .select-box{width:24px;height:24px;flex:0 0 24px;border:2px solid var(--cyan);display:inline-flex;align-items:center;justify-content:center;background:#06151f;color:var(--orange2);font-weight:900;font-size:18px;line-height:1}
.existing-student-row[aria-pressed="true"] .select-box{border-color:var(--orange);background:#4a2b10}
.student-picker-toolbar{position:sticky;top:0;z-index:3;background:linear-gradient(180deg,#07131d 82%,rgba(7,19,29,0));padding:0 0 10px}
.student-picker-toolbar input{margin-top:6px}
.student-picker-summary{margin-top:6px;font-size:.78rem;color:var(--muted)}
.list-item .meta{font-size:.78rem;color:var(--muted)}
.score-pill{min-width:44px;height:34px;padding:0 8px;display:inline-flex;align-items:center;justify-content:center;border:2px solid var(--orange);background:#3b240f;color:#fff1cf;font-weight:700}
.student-row{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:center}
.student-name{font-weight:700}
.student-actions{display:flex;gap:6px}
.sticky-actions{position:sticky;bottom:0;z-index:35;padding:12px;margin:12px -16px -16px;background:linear-gradient(180deg,rgba(7,18,31,.2),rgba(7,18,31,.98) 30%);display:flex;gap:10px;flex-wrap:wrap}
.tabs{display:flex;gap:8px;overflow:auto;padding-bottom:5px}
.tab{white-space:nowrap;min-height:44px;border:2px solid #275763;background:#081a24;color:var(--muted);padding:9px 12px;text-transform:uppercase}
.tab.active{border-color:var(--orange);color:var(--cream);background:#38240f}
.rule-row{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:center;border-bottom:1px dashed #28525a;padding:10px 0}
.rule-row:last-child{border-bottom:0}
.locker-manager-list{display:grid;gap:10px;max-height:min(56vh,520px);overflow:auto;padding-right:3px}
.locker-manager-row{
  display:grid;
  grid-template-columns:auto minmax(0,1fr) auto;
  gap:10px;
  align-items:center;
  padding:11px;
  border:2px solid var(--cyan-dim);
  background:#071820;
}
.locker-manager-row.off{opacity:.55;filter:saturate(.45)}
.locker-mini{
  width:54px;height:62px;display:grid;place-items:center;
  border:3px solid var(--cyan-dim);background:#0b1b25;
  font-family:var(--pixel);font-size:1.15rem;color:var(--orange2);
  box-shadow:4px 4px 0 #02070d;
}
.locker-tag{display:inline-flex;align-items:center;gap:5px;font-size:.65rem;color:var(--muted);margin-top:4px}
.locker-points{font-family:var(--pixel);font-size:.72rem;color:var(--cyan);white-space:nowrap}
.locker-scene{
  min-height:250px;
  display:grid;
  place-items:center;
  position:relative;
  overflow:hidden;
  margin:8px auto 12px;
  max-width:390px;
}
.locker-cabinet{
  width:160px;height:215px;position:relative;
  background:#18343e;border:7px solid #071016;
  box-shadow:0 0 0 4px var(--cyan-dim),10px 10px 0 #02070d;
}
.locker-cabinet::before{
  content:"";
  position:absolute;inset:14px;
  border:4px solid #2c5962;background:#071820;
}
.locker-cabinet::after{
  content:"";
  position:absolute;right:18px;top:102px;
  width:8px;height:20px;background:var(--orange2);
  box-shadow:0 0 0 3px #071016;
}
.locker-result{
  position:absolute;
  left:50%;top:52%;
  transform:translate(-50%,-50%);
  width:min(260px,80%);
  z-index:3;
  text-align:center;
  animation:lockerDrop .55s steps(5,end) both;
}
.locker-result.predefined{
  border:4px solid var(--orange);
  background:#f1e3c6;color:#16120c;
  padding:12px;
  box-shadow:7px 7px 0 #02070d;
}
.locker-result.custom{
  border:4px solid var(--cream);
  background:#ece4cf;color:#17130e;
  padding:14px 10px;
  box-shadow:7px 7px 0 #02070d;
  font-family:var(--pixel);
  font-size:.74rem;
  line-height:1.45;
}
.locker-result-icon{font-size:2.2rem;line-height:1;margin-bottom:7px}
.locker-result-name{font-weight:800}
.locker-result-effect{margin-top:7px;font-size:.8rem}
@keyframes lockerDrop{
  0%{transform:translate(-50%,-90%) scale(.8);opacity:0}
  70%{transform:translate(-50%,-43%) scale(1.05);opacity:1}
  100%{transform:translate(-50%,-50%) scale(1);opacity:1}
}
@media(max-width:560px){
  .locker-manager-row{grid-template-columns:auto minmax(0,1fr)}
  .locker-manager-row .row{grid-column:1/-1;justify-content:stretch}
  .locker-manager-row .row .btn{flex:1 1 120px}
  .locker-cabinet{width:132px;height:180px}
}

.toggle{width:54px;height:30px;border:2px solid var(--cyan-dim);background:#08151d;position:relative;display:inline-block;padding:0}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;background:var(--muted);transition:.15s}
.toggle.on{border-color:var(--orange);background:#4a2b10}
.toggle.on::after{left:27px;background:var(--orange2)}
.candidate-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.candidate{padding:18px;text-align:center;min-height:150px;display:flex;flex-direction:column;justify-content:center;gap:10px}
.candidate .avatar{font-size:2.3rem}
.candidate .name{font-weight:700;font-size:1.08rem}

/* VISUAL FIDELITY H5 – kandidáti ke zkoušení */
.candidates-screen{max-width:760px;margin:0 auto;padding:2px 0 6px}
.candidates-head{position:relative;text-align:center;padding:0 4px 13px}
.candidates-title{
  margin:0;color:#fff9e8;font-family:var(--pixel);font-size:clamp(2rem,7.8vw,3.75rem);line-height:1.03;
  text-transform:uppercase;letter-spacing:.015em;text-shadow:4px 4px 0 #ff4b2c,7px 7px 0 #06121d
}
.candidates-subtitle{margin-top:8px;color:#20f3f4;font-family:var(--pixel);font-size:clamp(.76rem,2.9vw,1.02rem);line-height:1.4;text-shadow:2px 2px 0 #05202a}
.candidates-step{margin-top:4px;text-align:right;color:#20f3f4;font-family:var(--pixel);font-size:.8rem;letter-spacing:.03em}
.candidates-context{
  display:grid;grid-template-columns:78px minmax(0,1fr);gap:15px;align-items:center;
  border:4px solid #20e9ee;background:linear-gradient(180deg,#0b3346 0,#06202e 100%);padding:10px 16px 11px;
  box-shadow:inset 0 0 0 3px #06101a,inset 0 0 0 6px #136174,6px 6px 0 #02070d;margin:0 0 15px;
  clip-path:polygon(12px 0,calc(100% - 12px) 0,100% 12px,100% calc(100% - 12px),calc(100% - 12px) 100%,12px 100%,0 calc(100% - 12px),0 12px)
}
.candidates-context img{width:72px;height:72px;object-fit:contain;image-rendering:pixelated;filter:drop-shadow(3px 3px 0 #02070d)}
.candidates-context-class{font-family:var(--pixel);font-size:clamp(.78rem,2.8vw,1rem);line-height:1.5;color:#fff8e9;text-shadow:2px 2px 0 #07121f}
.candidates-context-subject{margin-top:2px;font-family:var(--pixel);font-weight:700;color:#fff8e9;font-size:clamp(.75rem,2.7vw,.98rem);line-height:1.45;text-shadow:2px 2px 0 #07121f}
.candidates-list{display:grid;gap:12px;margin-top:2px}
.candidate-choice{
  width:100%;display:grid;grid-template-columns:92px minmax(0,1fr) 184px;gap:14px;align-items:center;min-height:132px;
  padding:11px 14px;text-align:left;border:4px solid #1ff3f3;background:linear-gradient(180deg,#07334a 0,#062335 100%);color:var(--cream);
  box-shadow:inset 0 0 0 3px #07121f,inset 0 0 0 6px #0f6476,6px 6px 0 #02070d;
  clip-path:polygon(12px 0,calc(100% - 12px) 0,100% 12px,100% calc(100% - 12px),calc(100% - 12px) 100%,12px 100%,0 calc(100% - 12px),0 12px);
  transition:filter .1s ease,transform .1s ease
}
.candidate-choice:hover{filter:brightness(1.08)}
.candidate-choice:active{transform:translate(2px,2px);box-shadow:inset 0 0 0 3px #07121f,inset 0 0 0 6px #0f6476,3px 3px 0 #02070d}
.candidate-choice.is-selected{
  border-color:#fff8e4;background:linear-gradient(180deg,#765806 0,#3d2d03 100%);
  box-shadow:inset 0 0 0 4px #ffb900,inset 0 0 0 8px #925c00,7px 7px 0 #02070d
}
.candidate-pixel-avatar{width:74px;height:88px;position:relative;margin:auto;image-rendering:pixelated;filter:drop-shadow(4px 4px 0 #02070d)}
.candidate-pixel-avatar::before{
  content:"";position:absolute;width:34px;height:34px;left:20px;top:13px;background:#ffe7b8;
  box-shadow:-7px -7px 0 #10202a,0 -12px 0 #10202a,7px -7px 0 #10202a,-12px 0 0 #10202a,12px 0 0 #10202a
}
.candidate-pixel-avatar::after{
  content:"";position:absolute;width:52px;height:30px;left:11px;top:53px;background:#2be8eb;
  box-shadow:-7px 7px 0 #07121f,7px 7px 0 #07121f,0 -5px 0 #0f7580
}
.candidate-pixel-avatar.avatar-2::before{box-shadow:-12px -7px 0 #754121,-5px -12px 0 #754121,5px -12px 0 #754121,12px -7px 0 #754121,-17px 4px 0 #754121,17px 4px 0 #754121,-17px 13px 0 #754121,17px 13px 0 #754121}
.candidate-pixel-avatar.avatar-3::before{box-shadow:-7px -8px 0 #3f2418,0 -12px 0 #3f2418,7px -8px 0 #3f2418,-12px 0 0 #3f2418,12px 0 0 #3f2418}
.candidate-copy{min-width:0;display:flex;flex-direction:column;justify-content:center}
.candidate-kicker{font-family:var(--pixel);font-size:clamp(.65rem,2.45vw,.82rem);color:#20f3f4;text-transform:none;line-height:1.25;text-shadow:2px 2px 0 #05202a}
.candidate-choice.is-selected .candidate-kicker{color:#20f3f4}
.candidate-name{margin-top:3px;font-family:var(--pixel);font-weight:700;font-size:clamp(1.08rem,4vw,1.6rem);line-height:1.25;color:#fff9e8;overflow-wrap:anywhere;text-shadow:2px 2px 0 #07121f}
.candidate-points{margin-top:4px;color:#ffc21c;font-family:var(--pixel);font-size:clamp(.9rem,3.15vw,1.15rem);line-height:1.2;text-shadow:2px 2px 0 #5f3a00}
.candidate-history{display:none}
.candidate-select-pill{
  width:100%;min-height:64px;display:flex;align-items:center;justify-content:center;gap:9px;padding:8px 14px;
  border:5px solid #fff4da;background:#ff8b0d;color:#130c03;font-family:var(--pixel);font-size:clamp(.8rem,2.8vw,1rem);
  box-shadow:inset 0 0 0 4px #ffc21d,inset 0 0 0 7px #d94e00,5px 5px 0 #02070d;text-transform:none;
  clip-path:polygon(10px 0,calc(100% - 10px) 0,100% 10px,100% calc(100% - 10px),calc(100% - 10px) 100%,10px 100%,0 calc(100% - 10px),0 10px)
}
.candidate-choice.is-selected .candidate-select-pill::before{content:"✓";font-family:system-ui,sans-serif;font-size:1.55rem;font-weight:1000;line-height:1}
.candidates-info{
  display:grid;grid-template-columns:52px minmax(0,1fr);gap:12px;align-items:center;margin:17px 0 9px;padding:9px 13px;
  border:4px solid #21edf0;background:linear-gradient(180deg,#0a2d3d,#061e2b);color:#fff8e8;
  box-shadow:inset 0 0 0 3px #07121f,5px 5px 0 #02070d;
  clip-path:polygon(10px 0,calc(100% - 10px) 0,100% 10px,100% calc(100% - 10px),calc(100% - 10px) 100%,10px 100%,0 calc(100% - 10px),0 10px);
  font-family:var(--pixel);font-size:clamp(.65rem,2.35vw,.82rem);line-height:1.5
}
.candidates-info-icon{width:43px;height:43px;border:0;border-radius:50%;display:grid;place-items:center;background:#1ce7ee;color:#06121b;font-family:var(--pixel);font-size:1.05rem;font-weight:900;box-shadow:4px 4px 0 #07121f}
.candidates-redraw,.candidates-other{
  width:100%;min-height:61px;margin-top:9px;border:4px solid #1fe9ee;background:linear-gradient(180deg,#092e40,#061e2c);color:#20eff2;
  font-family:var(--pixel);font-size:clamp(.72rem,2.65vw,.94rem);text-transform:none;box-shadow:inset 0 0 0 3px #07121f,5px 5px 0 #02070d;
  clip-path:polygon(10px 0,calc(100% - 10px) 0,100% 10px,100% calc(100% - 10px),calc(100% - 10px) 100%,10px 100%,0 calc(100% - 10px),0 10px)
}
.candidates-redraw{color:#fff8e8}
.candidates-redraw::first-letter{color:#20eff2}
.candidates-confirm{
  width:100%;min-height:78px;margin-top:15px;border:5px solid #fff5dc;background:linear-gradient(180deg,#ff9d12,#ff7800);color:#140c02;
  font-family:var(--pixel);font-size:clamp(.9rem,3.5vw,1.22rem);text-transform:none;
  box-shadow:inset 0 0 0 4px #ffc31f,inset 0 0 0 8px #e95c00,6px 6px 0 #02070d;
  clip-path:polygon(12px 0,calc(100% - 12px) 0,100% 12px,100% calc(100% - 12px),calc(100% - 12px) 100%,12px 100%,0 calc(100% - 12px),0 12px)
}

@media(max-width:560px){.boss-adjustment-row{grid-template-columns:1fr}}

.teacher-actions{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end}

/* MVP 0.2 – lepší správa tříd a žáků */
.clickable-row{cursor:pointer;transition:filter .12s ease,border-color .12s ease}
.clickable-row:hover,.clickable-row:focus-visible{border-color:var(--orange);filter:brightness(1.08);outline:none}
.clickable-row:active{transform:translate(1px,1px)}

/* ================================================================
   MVP 0.3 – RESPONZIVNÍ HARDENING PRO MOBIL / TABLET / DESKTOP
   ================================================================ */
:root{
  --content-pad:clamp(8px,2.5vw,16px);
}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;}
body{width:100%;max-width:100%;}
img,svg,canvas,video{max-width:100%;height:auto;}
button,input,select,textarea{max-width:100%;}
.container,.card,.pixel-frame,.pixel-inset,.list-item,.student-row,.rule-row,
.topbar>*,.row>*,.grid>*,.form-grid>*,.home-grid>*,.candidate-grid>*{min-width:0;}
.student-name,.meta,label,p,h1,h2,h3,.badge,.btn,.tab,td,th{
  overflow-wrap:anywhere;
  word-break:normal;
}
.container{padding:var(--content-pad);}
.topbar{max-width:100%;flex-wrap:wrap;align-items:center;}
.brand{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.nav-actions{flex:0 0 auto;}
.context-strip{min-width:0;flex:1 1 100%;order:3;}
.row{max-width:100%;}
.btn{white-space:normal;line-height:1.2;text-align:center;}
.icon-btn{flex:0 0 auto;}
.list{max-width:100%;overflow-x:hidden;overscroll-behavior:contain;}
.list-item{max-width:100%;}
.list-item>div:first-child{min-width:0;}
.list-item .student-name,.list-item .meta{max-width:100%;}
.student-actions{min-width:0;flex-wrap:wrap;justify-content:flex-end;}
.student-actions .btn{flex:1 1 auto;min-width:100px;}
.rule-row>div:first-child{min-width:0;}
.rule-row .row{min-width:0;justify-content:flex-end;}
.rule-row .row .btn{flex:1 1 auto;min-width:92px;}
.sticky-actions{max-width:calc(100% + 32px);}
.tabs{max-width:100%;-webkit-overflow-scrolling:touch;}
.table-wrap{max-width:100%;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain;}
table{font-size:clamp(.72rem,2.4vw,.95rem);}
th,td{padding:clamp(7px,1.8vw,10px);}
.modal{max-width:calc(100vw - 24px);}
.loading-box,.login-box{max-width:100%;}
.scene{width:100%;}

/* střední mobil / malý tablet */
@media(max-width:700px){
  .topbar{padding:8px 10px;gap:8px;}
  .brand{font-size:.9rem;max-width:calc(100vw - 130px);}
  .nav-actions{gap:6px;}
  .icon-btn{min-width:44px;min-height:44px;padding:7px 9px;}
  .section-title{align-items:flex-start;flex-direction:column;margin:12px 0;}
  .section-title h1{line-height:1.08;}
  .home-card{min-height:120px;padding:14px;}
  .list-item{padding:10px;gap:8px;align-items:flex-start;}
  .student-row{grid-template-columns:minmax(0,1fr) auto;align-items:start;}
  .student-row>.score-pill{grid-column:2;grid-row:1;align-self:start;}
  .student-actions{grid-column:1/-1;width:100%;justify-content:stretch;}
  .student-actions .btn{width:auto;flex:1 1 120px;}
  .rule-row{grid-template-columns:minmax(0,1fr) auto;align-items:start;}
  .rule-row>.score-pill{grid-column:2;grid-row:1;}
  .rule-row>.toggle,.rule-row>.row{grid-column:1/-1;justify-self:stretch;width:100%;}
  .rule-row>.toggle{width:54px;justify-self:end;}
  .candidate{grid-template-columns:auto minmax(0,1fr);}
  .candidate .btn{grid-column:1/-1;width:100%;}
  .podium{gap:6px;min-height:210px;}
  .podium-slot{font-size:.82rem;}
  .podium-box{padding:8px;font-size:.95rem;}
  .table-wrap{max-height:55vh;}
}

/* běžný telefon */
@media(max-width:520px){
  body{font-size:15px;}
  .container{padding:8px;}
  .card{padding:10px;}
  .pixel-frame{box-shadow:0 0 0 1px #12313c,4px 4px 0 var(--shadow);}
  .topbar{position:sticky;top:0;}
  .brand{font-size:.8rem;max-width:calc(100vw - 115px);}
  .nav-actions .btn{padding:8px 9px;min-height:44px;}
  .badge{font-size:.72rem;padding:4px 7px;}
  .home-grid{gap:10px;}
  .home-card{min-height:105px;padding:12px;}
  .home-card h2{font-size:1rem;}
  .form-grid{gap:9px;}
  input,select,textarea{font-size:16px;/* zabrání zoomu iOS */}
  .btn{min-height:46px;padding:9px 10px;font-size:.86rem;letter-spacing:.02em;}
  .btn.full{width:100%;}
  .list{gap:7px;max-height:min(62dvh,560px);}
  .list-item{min-height:54px;padding:9px;}
  .student-row{display:grid;grid-template-columns:minmax(0,1fr) auto;}
  .student-name{font-size:.94rem;line-height:1.22;}
  .list-item .meta{font-size:.72rem;line-height:1.35;}
  .score-pill{min-width:40px;height:31px;font-size:.82rem;}
  .student-actions{gap:6px;}
  .student-actions .btn{font-size:.78rem;min-width:0;flex:1 1 0;padding:8px;}
  .sticky-actions{margin:8px -10px -10px;padding:9px;gap:7px;}
  .sticky-actions .btn{flex:1 1 100%;}
  .rule-row{gap:7px;padding:9px 0;}
  .rule-row .row{gap:6px;}
  .rule-row .row .btn{font-size:.76rem;padding:8px 6px;min-width:0;}
  .candidate{padding:11px;gap:8px;}
  .candidate .name{font-size:.98rem;}
  .timer{font-size:clamp(2.4rem,17vw,4.4rem);}
  .grade-grid{grid-template-columns:repeat(5,minmax(0,1fr));gap:5px;}
  .grade-btn{min-width:0;min-height:52px;padding:5px;font-size:1.15rem;}
  .podium{grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;min-height:190px;}
  .podium-slot{gap:5px;font-size:.72rem;overflow:hidden;}
  .podium-slot>div:not(.podium-box):not(.avatar-chip){overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%;}
  .podium-box{padding:5px;font-size:.85rem;}
  .podium-slot:nth-child(1) .podium-box{height:90px}
  .podium-slot:nth-child(2) .podium-box{height:125px}
  .podium-slot:nth-child(3) .podium-box{height:72px}
  .avatar-chip{width:36px;height:36px;}
  .table-wrap{margin-left:0!important;margin-right:0!important;}
  table{min-width:620px;font-size:.72rem;}
  th,td{padding:7px 8px;}
  .modal-backdrop{padding:8px;align-items:end;}
  .modal{width:100%;max-width:100%;max-height:88dvh;padding:12px;border-width:2px;}
  .modal-actions{gap:7px;}
  .modal-actions .btn{flex:1 1 120px;}
  .loading-screen,.login-wrap{padding:8px;}
  .loading-box,.login-box{padding:10px;}
  .loading-title{font-size:clamp(1.65rem,13vw,3.3rem);line-height:1;}
  .loading-slogan{font-size:.8rem;}
  .discipline{font-size:.6rem;}
  .scene{min-height:160px;margin:14px auto 10px;}
  .blackboard{left:22%;width:60%;height:82px;}
  .teacher{left:6%;transform:scale(.85);transform-origin:bottom left;}
  .student-walk{transform:scale(.85);transform-origin:bottom right;}
  .loading-label{font-size:.92rem;}
  .progress{height:20px;}
  .wheel{width:min(300px,86vw);}
  .wheel-center{width:72px;height:72px;font-size:.68rem;}
  .class-row{align-items:stretch;flex-direction:column;}
  .class-row .fake-btn{width:100%;}
}

/* velmi úzké telefony – 320–380 px */
@media(max-width:380px){
  body{font-size:14px;}
  .container{padding:6px;}
  .topbar{padding:7px 8px;}
  .brand{max-width:calc(100vw - 106px);font-size:.75rem;}
  .icon-btn{min-width:42px;min-height:42px;padding:6px 7px;}
  .back-nav-btn{min-height:42px;padding:6px 8px;font-size:.72rem}
  .back-nav-btn .back-arrow{margin-right:2px}
  .card{padding:8px;}
  .btn{font-size:.8rem;padding:8px;}
  .student-row{grid-template-columns:minmax(0,1fr) auto;gap:6px;}
  .student-actions{grid-template-columns:1fr 1fr;display:grid;}
  .student-actions .btn{width:100%;}
  .rule-row{grid-template-columns:minmax(0,1fr) auto;}
  .score-pill{min-width:36px;padding:0 5px;}
  .podium-slot{font-size:.66rem;}
  table{min-width:580px;}
}

/* široký desktop – zabránit příliš roztaženým řádkům */
@media(min-width:1200px){
  .container{width:min(1180px,calc(100% - 32px));}
}



/* MVP 2.3 – Sborovna: jednoduchý chat učitelů + nastavení notifikací */
.subject-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.subject-card{min-height:120px;padding:16px;display:flex;align-items:center;justify-content:space-between;gap:14px;text-align:left}
.subject-card>div{min-width:0}
.subject-card .subject-icon{font-size:2rem;color:var(--orange2);flex:0 0 auto}
.topic-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center}
.topic-actions{display:flex;gap:6px;flex-wrap:wrap}
.topic-choice-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-top:10px}
.topic-choice{width:100%;min-height:54px;text-align:left;white-space:normal;line-height:1.25}
.topic-choice strong{display:block}
.topic-choice small{display:block;margin-top:4px;opacity:.72}

.exam-wheel-wrap{
  position:relative;
  width:min(250px,72vw);
  margin:16px auto 10px;
  display:grid;
  place-items:center;
}
.exam-wheel-pointer{
  position:absolute;
  z-index:5;
  top:-16px;
  left:50%;
  transform:translateX(-50%);
  color:var(--cream);
  font-size:1.65rem;
  filter:drop-shadow(3px 3px 0 #02070d);
  animation:pointerBob .9s steps(2,end) infinite;
}
.exam-topic-wheel{
  width:100%;
  margin:0;
  border-width:7px;
  box-shadow:0 0 0 4px #17343d,8px 8px 0 #02070d;
  animation:topicWheelIdle 9s linear infinite;
}
.exam-topic-wheel::after{display:none}
.exam-topic-wheel .wheel-center{
  width:76px;
  height:76px;
  border-width:4px;
  font-size:.66rem;
}
.exam-topic-wheel.is-spinning{
  animation:topicWheelSpin 2.1s cubic-bezier(.12,.68,.18,1) forwards;
}
.wheel-caption{
  text-align:center;
  color:var(--cyan);
  font-size:.72rem;
  letter-spacing:.04em;
  margin-bottom:8px;
}
@keyframes topicWheelIdle{
  from{transform:rotate(0deg)}
  to{transform:rotate(360deg)}
}
@keyframes topicWheelSpin{
  0%{transform:rotate(0deg)}
  100%{transform:rotate(1800deg)}
}
@keyframes pointerBob{
  0%,100%{top:-16px}
  50%{top:-11px}
}
@media(prefers-reduced-motion:reduce){
  .exam-topic-wheel,.exam-wheel-pointer{animation:none!important}
}

.grade-toolbar{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;align-items:end}
.grade-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.gradebook-scroll{overflow:auto;max-width:100%;border:2px solid #244f5a;-webkit-overflow-scrolling:touch}
.gradebook-table{min-width:760px}
.gradebook-table th:first-child,.gradebook-table td:first-child{position:sticky;left:0;z-index:3;background:#0a222c}
.gradebook-table th:first-child{z-index:4;background:#0d2935}
.grade-cell{text-align:center;min-width:76px}
.grade-pill{display:inline-grid;place-items:center;min-width:34px;height:30px;padding:0 7px;border:2px solid var(--cyan-dim);background:#0a2029;color:var(--cream);font-weight:700}
.grade-pill.no-grade{border-color:var(--orange);color:var(--orange2);font-size:.68rem;min-width:64px}
.grade-list-mobile{display:none}
.subject-class-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:10px}
.subject-class-list label{border:2px solid #245967;background:#081a24;padding:8px;display:flex;flex-direction:row;align-items:center;gap:8px}
.subject-class-list input{width:20px;height:20px;min-height:0}
@media(max-width:820px){
  .subject-grid{grid-template-columns:1fr}
  .grade-toolbar{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:560px){
  .grade-toolbar{grid-template-columns:1fr}
  .grade-actions .btn{width:100%}
  .subject-card{align-items:flex-start;flex-direction:column}
  .subject-card .btn{width:100%}
  .subject-class-list{grid-template-columns:1fr}
  .topic-row{grid-template-columns:1fr}
  .topic-actions .btn{flex:1 1 120px}
}

/* Visual pass v5 – krok 5 / 6: výběr tématu a Kolo štěstí */
.topic-screen{
  width:min(100%,940px);
  margin:0 auto;
  padding:2px 0 18px;
}
.topic-head{position:relative;text-align:center;margin:4px 0 14px;padding:0 84px}
.topic-title-line{display:flex;align-items:center;justify-content:center;gap:14px}
.topic-title-icon{width:68px;height:62px;object-fit:contain;image-rendering:pixelated;filter:drop-shadow(3px 3px 0 #02101b)}
.topic-title{
  margin:0;font-family:var(--pixel);font-size:clamp(2rem,6vw,3.7rem);line-height:.98;
  text-transform:uppercase;color:#76efff;letter-spacing:.02em;
  text-shadow:0 3px 0 #0b7897,3px 6px 0 #02101b;
}
.topic-subtitle{margin-top:10px;color:#d8f8ff;font-size:clamp(.82rem,2.2vw,1.05rem)}
.topic-step{position:absolute;right:0;top:8px;color:#20d7ee;font-family:var(--pixel);font-size:.66rem;letter-spacing:.04em}
.topic-context{
  display:grid;grid-template-columns:112px minmax(0,1fr) 215px;gap:0;align-items:stretch;
  border:3px solid #20dced;background:#05192a;box-shadow:5px 5px 0 #010912;margin:14px 0 16px;
}
.topic-student-box{display:grid;place-items:center;padding:10px;border-right:2px solid #14748d;background:#061d30}
.topic-student-photo{width:86px;height:94px;object-fit:cover;image-rendering:pixelated}
.topic-context-data{display:grid;gap:6px;padding:14px 18px;align-content:center}
.topic-context-data>div{display:grid;grid-template-columns:105px minmax(0,1fr);gap:12px;align-items:baseline}
.topic-context-data span{color:#cef7ff;font-size:.94rem}
.topic-context-data strong{color:#ffd42f;font-size:1.02rem;overflow-wrap:anywhere}
.topic-motto{
  border-left:2px solid #14748d;padding:12px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px;
  color:#1892af;font-family:var(--pixel);font-size:.65rem;line-height:1.38;background:#061d30;
}
.topic-motto-face{color:#b99531;font-size:1.65rem;font-family:system-ui,sans-serif}
.topic-mode-bar{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:0 6px 16px}
.topic-mode{
  min-height:56px;border:3px solid #20dced;background:#07273a;color:#d9f7ff;display:flex;align-items:center;justify-content:center;
  font-family:var(--pixel);font-size:.78rem;padding:8px;text-align:center;box-shadow:4px 4px 0 #010912;
}
button.topic-mode{width:100%;cursor:pointer}
.topic-mode.active{border-color:#ffd052;background:linear-gradient(180deg,#ffab22,#ff8614);color:#0b1117;box-shadow:inset 0 0 0 3px #ffcb47,4px 4px 0 #4a2005}
.topic-main-grid{display:grid;grid-template-columns:minmax(0,.96fr) minmax(0,1.04fr);gap:16px}
.topic-list-panel,.topic-wheel-panel{
  min-width:0;border:3px solid #20dced;background:#05192a;box-shadow:5px 5px 0 #010912;padding:14px;
  clip-path:polygon(12px 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%,0 12px);
}
.topic-list-panel h2,.topic-wheel-panel h2{margin:0;color:#d5f9ff;font-family:var(--pixel);font-size:.88rem}
.topic-list-panel h2{margin-bottom:10px}
.topic-wheel-panel h2{text-align:center;font-size:1rem}
.topic-wheel-sub{text-align:center;color:#c2edf7;margin:5px 0 9px;font-weight:700}
.topic-search-wrap{
  display:grid;grid-template-columns:30px minmax(0,1fr);align-items:center;gap:6px;
  border:2px solid #16b8d1;background:#08263a;padding:0 8px;margin-bottom:10px;
}
.topic-search-wrap span{font-size:1.4rem;color:#c9f8ff}
.topic-search-wrap input{border:0;background:transparent;box-shadow:none;min-height:44px;padding:7px 2px;color:#d7f5ff}
.topic-list-scroll{display:flex;flex-direction:column;gap:7px;max-height:455px;overflow:auto;padding-right:7px;scrollbar-color:#20dced #07131d;scrollbar-width:auto}
.topic-list-row{
  width:100%;min-height:78px;display:grid;grid-template-columns:66px minmax(0,1fr) 112px;gap:10px;align-items:center;
  padding:8px 10px;border:2px solid #17677f;background:#082337;color:#e8fbff;text-align:left;box-shadow:2px 2px 0 #010912;
}
.topic-list-row:hover{filter:brightness(1.08)}
.topic-list-row.is-selected{border-color:#ffb326;background:#302516;box-shadow:inset 0 0 0 2px #6d4b11,2px 2px 0 #010912}
.topic-list-icon{width:58px;height:58px;display:grid;place-items:center}
.topic-list-icon img{width:58px;height:58px;object-fit:contain;image-rendering:pixelated}
.topic-list-name{font-size:.96rem;font-weight:800;line-height:1.25;overflow-wrap:anywhere}
.topic-list-pick{
  min-height:44px;display:grid;place-items:center;border:2px solid #19b8d3;background:#0b3850;color:#e5fbff;padding:6px 9px;
  font-family:var(--pixel);font-size:.58rem;text-align:center;white-space:nowrap;
}
.topic-list-row.is-selected .topic-list-pick{border-color:#ffce54;background:#ff9417;color:#07131d}
.topic-quote{
  margin-top:10px;border-top:2px solid #17677f;padding:10px 2px 0;display:grid;grid-template-columns:82px 1fr auto;gap:8px;align-items:center;
  color:#1fb8dc;font-family:var(--pixel);font-size:.58rem;line-height:1.55;
}
.topic-quote img{width:76px;height:76px;object-fit:cover;image-rendering:pixelated}
.topic-quote-face{font-size:1.55rem;color:#b89731;font-family:system-ui,sans-serif}
.topic-wheel-wrap{position:relative;width:min(350px,92%);aspect-ratio:1;margin:5px auto 11px}
.topic-wheel{
  position:relative;width:100%;height:100%;border-radius:50%;border:8px solid #72ecff;outline:4px solid #193e50;
  background:conic-gradient(from -36deg,#ffb825 0 20%,#278fd3 20% 40%,#ef5b43 40% 60%,#38ad58 60% 80%,#8b55a8 80% 100%);
  box-shadow:0 0 0 4px #06131c,7px 7px 0 #010912;transition:transform 2.1s cubic-bezier(.12,.68,.18,1);
}
.topic-wheel::after{content:"";position:absolute;inset:7%;border-radius:50%;border:2px dashed rgba(255,255,255,.18);pointer-events:none}
.topic-wheel.is-spinning{animation:topicFidelitySpin 2.1s cubic-bezier(.12,.68,.18,1) forwards}
@keyframes topicFidelitySpin{from{transform:rotate(0)}to{transform:rotate(1800deg)}}
.topic-wheel-pointer{
  position:absolute;z-index:5;left:50%;top:-4px;transform:translate(-50%,-20%);width:0;height:0;
  border-left:18px solid transparent;border-right:18px solid transparent;border-top:42px solid #ff7b11;filter:drop-shadow(2px 2px 0 #531c00);
}
.topic-wheel-center{
  position:absolute;z-index:4;left:50%;top:50%;transform:translate(-50%,-50%);width:54px;height:54px;border-radius:50%;
  background:#ffae16;border:5px solid #b66b00;box-shadow:3px 3px 0 #34200a;
}
.topic-wheel-label{position:absolute;width:70px;height:70px;display:grid;place-items:center;z-index:2;transform:translate(-50%,-50%)}
.topic-wheel-label img{width:62px;height:62px;object-fit:contain;image-rendering:pixelated;filter:drop-shadow(2px 2px 0 #08202a)}
.topic-wheel-label.label-1{left:50%;top:22%}
.topic-wheel-label.label-2{left:78%;top:42%}
.topic-wheel-label.label-3{left:67%;top:74%}
.topic-wheel-label.label-4{left:33%;top:74%}
.topic-wheel-label.label-5{left:22%;top:42%}
.topic-spin{
  display:block;width:min(360px,94%);min-height:54px;margin:0 auto 12px;border:3px solid #ffdc69;background:linear-gradient(180deg,#ffa520,#ff8614);
  color:#091018;font-family:var(--pixel);font-size:.78rem;box-shadow:inset 0 0 0 3px #ffbe37,4px 4px 0 #4a2005;
}
.topic-result{
  display:grid;grid-template-columns:66px minmax(0,1fr);gap:10px;align-items:center;min-height:82px;padding:8px 10px;
  border:2px solid #1c9eb9;background:#082336;margin-top:8px;
}
.topic-result.has-topic{border-color:#23c6df}
.topic-result-icon{width:58px;height:58px;display:grid;place-items:center}
.topic-result-icon img{width:56px;height:56px;object-fit:contain;image-rendering:pixelated}
.topic-result-label{font-size:.72rem;color:#c9f0f8}
.topic-result-value{margin-top:4px;color:#ffd42f;font-size:1.06rem;font-weight:900;overflow-wrap:anywhere}
.topic-wheel-actions{display:grid;grid-template-columns:1.05fr 1fr 1fr;gap:9px;margin-top:10px}
.topic-wheel-actions button{min-height:54px;border:2px solid #20dced;background:#0a3145;color:#e3fbff;padding:7px;font-weight:800;box-shadow:3px 3px 0 #010912}
.topic-confirm-small{border-color:#ffd24f!important;background:#ff9417!important;color:#081018!important}
.topic-wheel-actions button:disabled{opacity:.42}
.topic-empty{border:2px dashed #286072;padding:16px;color:var(--muted);text-align:center}
.topic-wheel-empty{margin:44px 0}
.topic-manual-panel{
  margin-top:16px;border:3px solid #20dced;background:#061d30;box-shadow:5px 5px 0 #010912;padding:12px 14px;
  display:grid;grid-template-columns:70px auto minmax(180px,1fr) auto;grid-template-areas:"icon label input button" "icon save save button";gap:6px 12px;align-items:center;
}
.topic-manual-icon{grid-area:icon;width:58px;height:58px;object-fit:contain;image-rendering:pixelated}
.topic-manual-label{grid-area:label;color:#dffaff;font-size:1rem;font-weight:800;white-space:nowrap}
.topic-manual-panel>input{grid-area:input;min-width:0;border:2px solid #1aaec7;background:#08283c;color:#e7fbff;min-height:48px}
.topic-save-check{grid-area:save;display:flex;flex-direction:row;align-items:center;gap:7px;color:#7fc7d2;font-size:.68rem}
.topic-save-check input{width:18px;height:18px;min-height:0}
.topic-use-manual{
  grid-area:button;min-height:52px;border:3px solid #ffd153;background:#ff9417;color:#081018;padding:8px 16px;
  font-family:var(--pixel);font-size:.65rem;white-space:nowrap;box-shadow:3px 3px 0 #4a2005;
}
.topic-bottom-actions{display:grid;grid-template-columns:minmax(0,1fr) 245px;gap:16px;margin-top:18px}
.topic-final-confirm{
  min-height:72px;border:4px solid #ffdb69;background:linear-gradient(180deg,#ffa822,#ff8614);color:#081018;
  box-shadow:inset 0 0 0 3px #ffc846,6px 6px 0 #4a2005;font-family:var(--pixel);font-size:.86rem;padding:10px 16px;
}
.topic-final-confirm:disabled,.topic-confirm-small:disabled{opacity:.4;filter:saturate(.3)}
.topic-back{
  min-height:72px;border:3px solid #20dced;background:#08293c;color:#e3fbff;box-shadow:5px 5px 0 #010912;
  font-family:var(--pixel);font-size:.66rem;padding:10px;
}
@media(max-width:780px){
  .topic-head{padding:0 55px}
  .topic-title-icon{width:54px;height:50px}
  .topic-context{grid-template-columns:90px minmax(0,1fr)}
  .topic-motto{grid-column:1/-1;border-left:0;border-top:2px solid #14748d;min-height:66px}
  .topic-main-grid{grid-template-columns:1fr}
  .topic-list-scroll{max-height:330px}
  .topic-manual-panel{grid-template-columns:58px 1fr auto;grid-template-areas:"icon label label" "input input button" "save save save"}
  .topic-manual-icon{width:48px;height:48px}
  .topic-bottom-actions{grid-template-columns:1fr}
}
@media(max-width:500px){
  .topic-head{padding:0 0 32px}
  .topic-step{top:auto;bottom:0;right:50%;transform:translateX(50%)}
  .topic-title-line{gap:8px}
  .topic-title-icon{width:44px;height:42px}
  .topic-context{grid-template-columns:78px minmax(0,1fr)}
  .topic-student-photo{width:66px;height:74px}
  .topic-context-data{padding:10px}
  .topic-context-data>div{grid-template-columns:1fr;gap:1px}
  .topic-motto{display:none}
  .topic-mode-bar{grid-template-columns:1fr}
  .topic-list-row{grid-template-columns:54px minmax(0,1fr)}
  .topic-list-pick{grid-column:1/-1;width:100%}
  .topic-wheel-actions{grid-template-columns:1fr}
  .topic-manual-panel{grid-template-columns:1fr;grid-template-areas:"icon" "label" "input" "save" "button";text-align:center}
  .topic-manual-icon{justify-self:center}
  .topic-save-check{justify-content:center}
  .topic-use-manual{width:100%}
}

@media print{
  body{background:#fff!important;color:#000!important}
  .topbar,.grade-actions,.tabs,.offline-banner,.toast-root,.modal-root{display:none!important}
  .container{max-width:none!important;padding:0!important}
  .pixel-frame,.card{border:0!important;box-shadow:none!important;background:#fff!important;color:#000!important;padding:0!important}
  .gradebook-scroll{border:0!important;overflow:visible!important}
  .gradebook-table{min-width:0!important;width:100%!important;color:#000!important;background:#fff!important}
  .gradebook-table th,.gradebook-table td{position:static!important;background:#fff!important;color:#000!important;border:1px solid #555!important;font-size:9pt!important;padding:5px!important}
}


/* ======================================================================
   VISUAL PASS V1 — HLAVNÍ MENU + ZAHÁJENÍ ZKOUŠENÍ
   Vychází ze schválených pixel-art referencí ZZ-01.
   Funkční logika zůstává zachována.
   ====================================================================== */
:root{
  --pixel:"Courier New",ui-monospace,monospace;
  --arcade-bg:#031426;
  --arcade-panel:#051d31;
  --arcade-panel-2:#08263a;
  --arcade-cyan:#28e2f1;
  --arcade-cyan-dark:#087c9b;
  --arcade-orange:#ff8514;
  --arcade-orange-hi:#ffbd3c;
  --arcade-cream:#fff0bd;
  --arcade-ink:#08101a;
}
body{
  background:
    radial-gradient(circle at 50% -15%,rgba(20,102,136,.22),transparent 40%),
    linear-gradient(180deg,#04182b 0%,#031426 52%,#02101e 100%);
}
.crt-overlay{opacity:.22}
.container{width:min(940px,100%);padding:18px 22px 38px}
.topbar{
  position:sticky;top:8px;
  width:min(900px,calc(100% - 28px));
  margin:12px auto 0;
  padding:10px 14px;
  border:3px solid var(--arcade-cyan);
  border-bottom-width:5px;
  background:rgba(3,20,38,.97);
  box-shadow:0 0 0 2px #063c52,0 8px 0 #010913;
  backdrop-filter:none;
}
.brand-lockup{display:flex;align-items:center;gap:12px;min-width:0}
.brand-mark{width:58px;height:52px;object-fit:cover;image-rendering:pixelated;flex:0 0 auto}
.brand-copy{min-width:0;line-height:1}
.brand-main{
  font-family:var(--pixel);font-weight:900;font-size:clamp(1.05rem,3.7vw,1.7rem);
  letter-spacing:.035em;color:var(--arcade-cream);white-space:nowrap;
  text-shadow:2px 0 var(--arcade-orange),0 2px var(--arcade-orange),2px 2px #8e2d08;
}
.brand-code{margin-top:4px;font-family:var(--pixel);font-weight:900;letter-spacing:.15em;color:var(--arcade-cyan);font-size:.84rem}
.context-strip{display:none}
.nav-actions{gap:7px}
.topbar .icon-btn{
  min-width:46px;min-height:46px;padding:5px 8px;border:0;box-shadow:none;
  background:transparent;color:var(--arcade-cyan);font-size:1.5rem;
}
.topbar .icon-btn:hover{background:#08283a;filter:none}
.topbar .icon-btn.account-exit{border:0;background:transparent;color:var(--arcade-cyan)}
.topbar .avatar-chip{transform:scale(.92)}
.screen-nav{
  width:min(900px,calc(100% - 28px));margin:16px auto 0;
  display:flex;align-items:center;justify-content:space-between;gap:10px;
}
.screen-nav .back-nav-btn,.screen-nav .home-nav-btn{
  min-height:40px;padding:5px 4px;border:0;background:transparent;box-shadow:none;
  color:var(--arcade-cyan);font-family:var(--pixel);font-size:.8rem;
}
.screen-nav .back-nav-btn:hover,.screen-nav .home-nav-btn:hover{background:transparent;color:var(--arcade-cream)}
.screen-nav .back-arrow{font-size:1.35em;margin-right:5px}

/* Hlavní menu */
.arcade-home-head{text-align:center;margin:24px 0 20px}
.arcade-home-title{
  margin:0;font-family:var(--pixel);font-weight:900;letter-spacing:.025em;text-transform:uppercase;
  font-size:clamp(2rem,8vw,4.9rem);line-height:.94;color:var(--arcade-cream);
  text-shadow:0 3px 0 var(--arcade-orange),0 7px 0 #a92c08,4px 7px 0 #010913;
}
.arcade-home-title::before,.arcade-home-title::after{content:"—";color:var(--arcade-cyan);font-size:.42em;vertical-align:middle;text-shadow:none;margin:0 .28em}
.arcade-home-slogan{margin-top:16px;color:var(--arcade-cyan);font-family:var(--pixel);font-weight:700;font-size:clamp(.8rem,2.7vw,1.15rem);letter-spacing:.015em}
.home-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:22px}
.home-card{
  min-height:132px;padding:13px 16px;display:grid;grid-template-columns:112px minmax(0,1fr);align-items:center;gap:10px;
  text-align:left;overflow:hidden;border:4px solid var(--arcade-cyan);border-radius:0;
  background:linear-gradient(180deg,#08233a,#04182a);box-shadow:inset 0 0 0 3px #073a50,6px 6px 0 #010913;
}
.home-card::after{display:none}
.home-card[data-action="exam"]{
  border-color:var(--arcade-orange-hi);background:linear-gradient(180deg,#ff9e1e,#ff7411);
  box-shadow:inset 0 0 0 4px #ffcf4a,inset 0 0 0 8px #c44808,6px 6px 0 #010913;color:var(--arcade-ink)
}
.home-card:hover{filter:brightness(1.12)}
.home-card:active{transform:translate(2px,2px);box-shadow:inset 0 0 0 3px #073a50,3px 3px 0 #010913}
.home-card[data-action="exam"]:active{box-shadow:inset 0 0 0 4px #ffcf4a,inset 0 0 0 8px #c44808,3px 3px 0 #010913}
.home-card h2{margin:0;font-family:var(--pixel);font-weight:900;font-size:clamp(1rem,3.8vw,1.48rem);line-height:1.08;text-transform:none;letter-spacing:0;text-shadow:none}
.home-card[data-action="exam"] h2{color:#111;text-shadow:none}
.home-card .home-icon{width:100%;height:96px;display:grid;place-items:center;font-size:0;overflow:hidden}
.home-card .home-icon img{width:100%;height:100%;object-fit:contain;image-rendering:pixelated}
.home-card-desc{display:none}
.home-card .unread-pill{margin-left:7px}
.home-divider{
  margin:24px 0 18px;display:flex;align-items:center;gap:12px;color:var(--arcade-cyan);
  font-family:var(--pixel);font-size:.72rem;letter-spacing:.12em;text-align:center;text-transform:uppercase
}
.home-divider::before,.home-divider::after{content:"";height:3px;flex:1;background:var(--arcade-cyan);box-shadow:0 3px 0 #054b61}
.home-overview-label{margin:0 0 9px;color:var(--arcade-cyan);font-family:var(--pixel);font-size:.72rem;letter-spacing:.12em;text-transform:uppercase}
.home-summary-grid{margin-top:0}
.arcade-footer{
  margin-top:24px;padding-top:13px;border-top:3px solid var(--arcade-cyan);display:flex;justify-content:space-between;gap:12px;
  color:var(--arcade-cyan);font-family:var(--pixel);font-size:.7rem;letter-spacing:.05em
}

/* Zahájení zkoušení — krok 1 */
.exam-start{max-width:860px;margin:0 auto}
.exam-start-head{text-align:center;position:relative;margin:8px 0 22px;padding:4px 90px 0}
.exam-start-title{
  margin:0;color:var(--arcade-cream);font-family:var(--pixel);font-weight:900;text-transform:uppercase;
  font-size:clamp(2rem,7.2vw,4.4rem);line-height:.93;letter-spacing:.015em;
  text-shadow:0 3px 0 var(--arcade-orange),0 7px 0 #a92c08,4px 7px 0 #010913
}
.exam-start-title::before,.exam-start-title::after{content:"—";color:var(--arcade-cyan);font-size:.32em;vertical-align:middle;text-shadow:none;margin:0 .15em}
.exam-start-subtitle{margin-top:13px;color:var(--arcade-cyan);font-family:var(--pixel);font-weight:700;font-size:clamp(.9rem,2.8vw,1.18rem)}
.exam-step{position:absolute;right:0;bottom:-2px;color:var(--arcade-cyan);font-family:var(--pixel);font-weight:900;font-size:.8rem;letter-spacing:.04em}
.exam-start-section{margin-top:18px}
.arcade-section-label{display:flex;align-items:center;gap:12px;margin:0 0 8px;color:var(--arcade-cream)}
.arcade-section-label img{width:72px;height:64px;object-fit:contain;image-rendering:pixelated;flex:0 0 auto}
.arcade-section-label h2{margin:0;font-family:var(--pixel);font-weight:900;font-size:clamp(1.35rem,4.5vw,2.05rem)}
.arcade-select-wrap{position:relative}
.arcade-select-wrap::after{content:"⌄";position:absolute;right:18px;top:50%;transform:translateY(-54%);color:var(--arcade-cyan);font-size:2rem;font-weight:900;pointer-events:none}
.arcade-select{
  appearance:none;-webkit-appearance:none;width:100%;min-height:70px;padding:10px 56px 10px 22px;
  border:4px solid var(--arcade-cyan);border-radius:0;background:#061c30;color:var(--arcade-cream);
  box-shadow:inset 0 0 0 3px #07394e,5px 5px 0 #010913;font-family:var(--pixel);font-size:clamp(1rem,4vw,1.55rem);font-weight:900
}
.subject-choice-list{display:grid;gap:8px}
.arcade-subject-choice{
  width:100%;min-height:68px;padding:9px 17px;display:grid;grid-template-columns:44px minmax(0,1fr);gap:12px;align-items:center;
  text-align:left;border:4px solid var(--arcade-cyan);border-radius:0;background:#061c30;color:var(--arcade-cream);
  box-shadow:inset 0 0 0 3px #07394e,5px 5px 0 #010913;font-family:var(--pixel);font-weight:900;font-size:clamp(.9rem,3.3vw,1.28rem)
}
.arcade-subject-choice.selected{
  border-color:var(--arcade-orange-hi);background:linear-gradient(180deg,#ff9d1c,#ff7410);color:#101010;
  box-shadow:inset 0 0 0 4px #ffcf4a,inset 0 0 0 8px #c44808,5px 5px 0 #010913
}
.arcade-check{width:32px;height:32px;display:grid;place-items:center;border:3px solid currentColor;background:#071421;color:var(--arcade-cream);font-size:1.15rem}
.arcade-subject-choice.selected .arcade-check{background:var(--arcade-cream);color:#071421;border-color:#071421}
.subject-choice-note{display:block;margin-top:4px;font-family:"Courier New",monospace;font-size:.68rem;font-weight:400;opacity:.75}
.sr-only-select{position:absolute!important;width:1px!important;height:1px!important;padding:0!important;margin:-1px!important;overflow:hidden!important;clip:rect(0,0,0,0)!important;white-space:nowrap!important;border:0!important}
.exam-selection-summary{
  margin:18px 0 16px;padding:10px 16px;display:grid;grid-template-columns:92px minmax(0,1fr);gap:12px;align-items:center;
  border:4px solid var(--arcade-cyan);background:#061c30;box-shadow:inset 0 0 0 3px #07394e,5px 5px 0 #010913
}
.exam-selection-summary img{width:88px;height:76px;object-fit:contain;image-rendering:pixelated}
.selection-kicker{color:var(--arcade-cyan);font-family:var(--pixel);font-weight:900;font-size:.72rem;text-transform:uppercase;letter-spacing:.05em}
.selection-class{color:var(--arcade-orange-hi);font-family:var(--pixel);font-size:1.1rem;font-weight:900;margin-left:5px}
.selection-subject{margin-top:4px;color:var(--arcade-cream);font-weight:700;font-size:1rem;overflow-wrap:anywhere}
.exam-continue{
  width:100%;min-height:86px;padding:12px 22px;display:flex;align-items:center;justify-content:center;gap:16px;
  border:5px solid var(--arcade-orange-hi);border-radius:0;background:linear-gradient(180deg,#ff9d1c,#ff7410);color:#101010;
  box-shadow:inset 0 0 0 4px #ffd04e,inset 0 0 0 9px #c44808,6px 6px 0 #010913;
  font-family:var(--pixel);font-weight:900;font-size:clamp(1rem,4vw,1.55rem);text-transform:none
}
.exam-continue .arrow{font-size:1.45em;margin-left:auto}
.exam-continue:disabled{filter:grayscale(.65);opacity:.55}
.exam-start-empty{border:3px dashed var(--arcade-cyan-dark);padding:15px;color:var(--muted)}


/* ======================================================================
   VISUAL FIDELITY H3 — KROK 2/6: PŘÍTOMNOST
   Přesnější rekonstrukce podle schválené reference „Přítomnost žáků v Zkouškomatu“.
   Funkční logika přítomnosti zůstává beze změny.
   ====================================================================== */
.attendance-screen{max-width:860px;margin:0 auto;padding:0 0 4px}
.attendance-head{text-align:center;position:relative;margin:3px 0 17px;padding:0 96px 0}
.attendance-title{
  margin:0;color:#fff1bf;font-family:var(--pixel);font-weight:900;text-transform:uppercase;
  font-size:clamp(2.35rem,8.2vw,4.9rem);line-height:.93;letter-spacing:.012em;
  text-shadow:0 3px 0 #ff7120,0 7px 0 #b82d08,5px 8px 0 #010913
}
.attendance-subtitle{
  margin-top:12px;color:#25e8f4;font-family:var(--pixel);font-weight:900;
  font-size:clamp(.92rem,3vw,1.18rem);letter-spacing:.01em
}
.attendance-step{
  position:absolute;right:0;bottom:-2px;color:#25e8f4;font-family:var(--pixel);
  font-weight:900;font-size:.82rem;letter-spacing:.05em;white-space:nowrap
}
.attendance-context{
  margin:16px 0 12px;padding:12px 18px;display:grid;grid-template-columns:118px minmax(0,1fr);
  gap:12px;align-items:center;border:4px solid #25e8f4;background:linear-gradient(180deg,#08243a,#041a2c);
  box-shadow:inset 0 0 0 3px #07566c,inset 0 -5px 0 rgba(0,0,0,.28),5px 5px 0 #010913;
  clip-path:polygon(12px 0,calc(100% - 12px) 0,100% 12px,100% calc(100% - 12px),calc(100% - 12px) 100%,12px 100%,0 calc(100% - 12px),0 12px)
}
.attendance-context img{width:106px;height:86px;object-fit:contain;image-rendering:pixelated;filter:drop-shadow(3px 3px 0 #010913)}
.attendance-context-class{
  color:#fff3cf;font-family:var(--pixel);font-weight:900;
  font-size:clamp(1.05rem,4vw,1.62rem);line-height:1.13;letter-spacing:.01em
}
.attendance-context-subject{
  margin-top:7px;color:#fff3cf;font-family:var(--pixel);font-weight:900;
  font-size:clamp(.82rem,2.8vw,1.12rem);line-height:1.2
}
.attendance-list{
  display:flex;flex-direction:column;gap:8px;max-height:min(49vh,590px);overflow:auto;
  padding:2px 6px 5px 0;scrollbar-width:thin;scrollbar-color:#25e8f4 #041522;
  -webkit-overflow-scrolling:touch
}
.attendance-row{
  position:relative;min-height:70px;padding:8px 17px;display:grid;
  grid-template-columns:56px minmax(0,1fr) 48px 128px;gap:12px;align-items:center;
  border:4px solid #25e8f4;background:linear-gradient(180deg,#08233a 0%,#041a2c 100%);
  box-shadow:inset 0 0 0 2px #07566c,inset 0 -4px 0 rgba(0,0,0,.32),4px 4px 0 #010913;
  clip-path:polygon(10px 0,calc(100% - 10px) 0,100% 10px,100% calc(100% - 10px),calc(100% - 10px) 100%,10px 100%,0 calc(100% - 10px),0 10px);
  cursor:pointer;color:#fff3cf;transition:filter .08s linear,transform .08s linear
}
.attendance-row:hover{filter:brightness(1.1)}
.attendance-row:active{transform:translate(1px,1px)}
.attendance-row.is-absent{background:linear-gradient(180deg,#071d31,#061827);color:#8198a8}
.attendance-person{
  width:46px;height:48px;position:relative;color:#25e8f4;filter:drop-shadow(3px 3px 0 #012132);image-rendering:pixelated
}
.attendance-person::before{
  content:"";position:absolute;left:15px;top:1px;width:17px;height:17px;background:currentColor;
  box-shadow:-3px 3px 0 currentColor,3px 3px 0 currentColor
}
.attendance-person::after{
  content:"";position:absolute;left:9px;top:23px;width:29px;height:18px;background:currentColor;
  box-shadow:-5px 6px 0 -1px currentColor,5px 6px 0 -1px currentColor
}
.attendance-row.is-absent .attendance-person{color:#7892a4;filter:drop-shadow(2px 2px 0 #02111d)}
.attendance-name{
  min-width:0;color:inherit;font-family:var(--pixel);font-weight:900;
  font-size:clamp(.92rem,3.4vw,1.31rem);line-height:1.08;overflow-wrap:anywhere
}
.attendance-check{
  appearance:none;-webkit-appearance:none;width:42px;height:42px;min-height:42px;margin:0;padding:0;
  border:4px solid #fff4d5;background:#071421;display:grid;place-content:center;cursor:pointer;
  box-shadow:inset 0 0 0 2px #142b37,2px 2px 0 #010913
}
.attendance-check::after{
  content:"";width:13px;height:24px;border:solid #32ef45;border-width:0 7px 7px 0;
  transform:rotate(45deg) scale(0);transform-origin:center;transition:transform .05s steps(1,end);margin-top:-5px
}
.attendance-check:checked::after{transform:rotate(45deg) scale(1)}
.attendance-status{
  min-width:0;text-align:left;color:#25e8f4;font-family:var(--pixel);font-weight:900;
  font-size:clamp(.8rem,2.8vw,1.03rem);white-space:nowrap
}
.attendance-row.is-absent .attendance-status{color:#ff9b19}
.attendance-summary{
  margin-top:14px;padding:13px 20px;display:grid;grid-template-columns:1fr 4px 1fr;gap:18px;align-items:center;
  border:4px solid #25e8f4;background:linear-gradient(180deg,#082238,#041a2b);
  box-shadow:inset 0 0 0 3px #07566c,5px 5px 0 #010913;
  clip-path:polygon(10px 0,calc(100% - 10px) 0,100% 10px,100% calc(100% - 10px),calc(100% - 10px) 100%,10px 100%,0 calc(100% - 10px),0 10px);
  color:#fff3cf;font-family:var(--pixel);font-weight:900;text-align:center;font-size:clamp(.88rem,3vw,1.08rem)
}
.attendance-summary-sep{width:4px;height:48px;background:#25e8f4;justify-self:center;box-shadow:2px 0 0 #054858}
.attendance-summary strong{font-size:clamp(1.65rem,5.2vw,2.35rem);margin-left:9px;text-shadow:2px 2px 0 #010913}
.attendance-summary .present-count{color:#25ec42}
.attendance-summary .absent-count{color:#ff9b19}
.attendance-info{
  margin-top:12px;padding:11px 16px;display:grid;grid-template-columns:55px minmax(0,1fr);gap:12px;align-items:center;
  border:4px solid #25e8f4;background:linear-gradient(180deg,#082238,#041a2b);
  box-shadow:inset 0 0 0 3px #07566c,4px 4px 0 #010913;
  clip-path:polygon(10px 0,calc(100% - 10px) 0,100% 10px,100% calc(100% - 10px),calc(100% - 10px) 100%,10px 100%,0 calc(100% - 10px),0 10px);
  color:#fff3cf;font-family:var(--pixel);font-weight:900;font-size:clamp(.75rem,2.55vw,.96rem);line-height:1.32
}
.attendance-info-icon{
  width:46px;height:46px;display:grid;place-items:center;background:#25e8f4;color:#04182a;
  font-family:var(--pixel);font-size:1.38rem;font-weight:900;
  clip-path:polygon(9px 0,calc(100% - 9px) 0,100% 9px,100% calc(100% - 9px),calc(100% - 9px) 100%,9px 100%,0 calc(100% - 9px),0 9px)
}
.attendance-continue{margin-top:17px}
.attendance-empty{
  padding:24px;border:4px dashed #087c9b;background:#041a2b;color:#9bb8bd;text-align:center;font-family:var(--pixel)
}

@media(max-width:700px){
  .attendance-head{padding:0}.attendance-step{position:static;text-align:right;margin-top:8px}
  .attendance-context{grid-template-columns:88px minmax(0,1fr);padding:10px 12px}
  .attendance-context img{width:80px;height:68px}
  .attendance-row{grid-template-columns:46px minmax(0,1fr) 40px 100px;padding:8px 10px;gap:9px;min-height:66px}
  .attendance-person{transform:scale(.84);transform-origin:center}
  .attendance-check{width:36px;height:36px;min-height:36px;border-width:3px}
  .attendance-check::after{width:11px;height:20px;border-width:0 6px 6px 0}
  .attendance-list{max-height:min(48vh,560px)}
}
@media(max-width:480px){
  .attendance-row{grid-template-columns:34px minmax(0,1fr) 34px 78px;gap:7px;padding:7px 8px}
  .attendance-person{transform:scale(.7)}
  .attendance-check{width:31px;height:31px;min-height:31px}
  .attendance-check::after{width:9px;height:17px;border-width:0 5px 5px 0}
  .attendance-status{font-size:.69rem}
  .attendance-summary{gap:8px;padding:11px 8px}
  .attendance-summary strong{display:block;margin:5px 0 0}
  .attendance-info{grid-template-columns:42px minmax(0,1fr);padding:10px}
  .attendance-info-icon{width:38px;height:38px;font-size:1.05rem}
}

}
.exam-live-context-row,
.exam-result-row{
  display:grid;
  grid-template-columns:92px minmax(0,1fr);
  gap:10px;
  align-items:baseline;
  font-size:.9rem;
}
.exam-live-context-row span,
.exam-result-row span{
  color:var(--cyan);
  font-family:var(--pixel);
  font-size:.62rem;
  text-transform:uppercase;
}
.exam-live-context-row strong,
.exam-result-row strong{
  color:var(--cream);
  overflow-wrap:anywhere;
}
.exam-live-main{
  display:grid;
  grid-template-columns:minmax(240px,.85fr) minmax(280px,1.15fr);
  gap:14px;
  margin-top:14px;
}
.exam-student-panel,
.exam-timer-panel{
  border:2px solid var(--cyan-dim);
  background:#071720;
  box-shadow:5px 5px 0 #02070d;
  min-width:0;
}
.exam-student-panel{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:20px 14px 16px;
  min-height:310px;
  overflow:hidden;
}
.exam-student-panel .pixel-student{
  transform:scale(1.55);
  transform-origin:center;
  margin:30px auto 34px;
}
.exam-encourage{
  width:100%;
  border:2px solid #2a6170;
  background:#06131c;
  padding:10px;
  color:var(--cream);
  text-align:center;
  font-weight:700;
  font-style:italic;
  box-shadow:3px 3px 0 #02070d;
}
.exam-timer-panel{
  padding:18px;
  display:flex;
  flex-direction:column;
  justify-content:center;
}
.exam-timer-label{
  color:var(--cyan);
  text-align:center;
  font-family:var(--pixel);
  font-size:.72rem;
  text-transform:uppercase;
  margin-bottom:8px;
}
.exam-live-timer{
  border:3px solid var(--cyan-dim);
  background:#020a10;
  padding:16px 10px 13px;
  box-shadow:inset 0 0 0 3px #0c2530,5px 5px 0 #02070d;
}
.exam-live-timer .timer{
  font-family:var(--pixel);
  font-size:clamp(3rem,10vw,5.6rem);
  line-height:1;
  color:var(--orange2);
  text-shadow:4px 4px 0 #442810;
}
.exam-time-track{
  height:18px;
  margin-top:13px;
  border:2px solid #285b66;
  background:#041016;
  padding:2px;
}
.exam-time-progress{
  height:100%;
  width:100%;
  background:linear-gradient(90deg,var(--orange),var(--orange2));
  transition:width .45s linear;
}
.timer.over + .exam-time-track .exam-time-progress,
.exam-live-timer.is-over .exam-time-progress{
  background:var(--danger);
}
.exam-time-note{
  text-align:center;
  color:var(--muted);
  font-size:.76rem;
  margin-top:10px;
  line-height:1.4;
}
.exam-time-note.over{
  color:#ff9a8f;
  font-weight:700;
}
.exam-live-actions{
  display:grid;
  grid-template-columns:1fr;
  gap:10px;
  margin-top:14px;
}
.exam-end-button{
  width:100%;
  min-height:58px;
  border:3px solid #ff625a;
  background:#4c1718;
  color:#fff5ec;
  box-shadow:5px 5px 0 #210606;
  font-family:var(--pixel);
  font-size:.82rem;
  text-transform:uppercase;
}
.exam-end-button:hover{filter:brightness(1.1)}
.exam-live-note{
  margin-top:14px;
  border:2px solid var(--cyan-dim);
  background:#071720;
  padding:12px;
  box-shadow:4px 4px 0 #02070d;
}
.exam-live-note label{
  color:var(--cyan);
  font-family:var(--pixel);
  font-size:.66rem;
  text-transform:uppercase;
}
.exam-live-note textarea{
  margin-top:8px;
  min-height:90px;
  background:#04131b;
}
.exam-live-hint{
  display:grid;
  grid-template-columns:32px minmax(0,1fr);
  gap:10px;
  align-items:center;
  margin-top:12px;
  border:2px solid #245967;
  background:#071923;
  padding:10px 12px;
  color:var(--muted);
}
.exam-live-hint-icon{
  width:28px;height:28px;
  border:2px solid var(--cyan);
  display:grid;place-items:center;
  color:var(--cyan);
  font-family:var(--pixel);
}

/* známkování */
.grade-backdrop{
  padding:14px;
  align-items:center;
}
.grade-screen-modal{
  width:min(720px,96vw);
  max-height:94vh;
  overflow:auto;
  border:3px solid var(--cyan);
  background:#06151f;
  box-shadow:8px 8px 0 #02070d;
  padding:16px;
}
.grade-screen-head{
  text-align:center;
  border-bottom:2px solid var(--cyan-dim);
  padding-bottom:12px;
  margin-bottom:12px;
}
.grade-screen-head h2{
  margin:0;
  color:var(--cyan);
  font-family:var(--pixel);
  text-transform:uppercase;
  font-size:clamp(1.3rem,5vw,2rem);
}
.grade-context{
  border:2px solid var(--cyan-dim);
  background:#071c27;
  padding:10px 12px;
  display:grid;
  gap:4px;
  margin-bottom:14px;
}
.grade-context div{
  display:grid;
  grid-template-columns:88px minmax(0,1fr);
  gap:8px;
}
.grade-context span{
  color:var(--cyan);
  font-family:var(--pixel);
  font-size:.58rem;
  text-transform:uppercase;
}
.grade-context strong{color:var(--cream)}
.grade-picker-title{
  text-align:center;
  color:var(--cyan);
  font-family:var(--pixel);
  font-size:.76rem;
  text-transform:uppercase;
  margin:8px 0 10px;
}
.grade-picker{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:8px;
}
.grade-choice{
  min-height:70px;
  border:3px solid currentColor;
  background:#07151d;
  box-shadow:4px 4px 0 #02070d;
  font-family:var(--pixel);
  font-size:clamp(1.4rem,5vw,2.2rem);
  font-weight:900;
}
.grade-choice[data-grade="1"],.grade-choice[data-grade="2"]{color:#57dc77;background:#0a2c1b}
.grade-choice[data-grade="3"]{color:#ffd05e;background:#392a0b}
.grade-choice[data-grade="4"]{color:#ff9f43;background:#40250d}
.grade-choice[data-grade="5"]{color:#ff665f;background:#431416}
.grade-choice.is-selected{
  outline:3px solid #fff2cf;
  outline-offset:2px;
  transform:translate(2px,2px);
  box-shadow:2px 2px 0 #02070d;
}
.grade-no-grade{
  width:100%;
  margin-top:14px;
  min-height:54px;
  border:3px solid #ff665f;
  background:#451719;
  color:#fff4ed;
  font-family:var(--pixel);
  font-size:.72rem;
  text-transform:uppercase;
}
.grade-note-box{margin-top:14px}
.grade-note-box label{
  color:var(--cyan);
  font-family:var(--pixel);
  font-size:.62rem;
  text-transform:uppercase;
}
.grade-modal-actions{
  display:grid;
  grid-template-columns:1fr 1.25fr;
  gap:10px;
  margin-top:14px;
}
.grade-cancel,.grade-save{
  min-height:52px;
  border:2px solid var(--cyan-dim);
  font-family:var(--pixel);
  text-transform:uppercase;
  font-size:.68rem;
  box-shadow:4px 4px 0 #02070d;
}
.grade-cancel{background:#10212a;color:var(--cream)}
.grade-save{border-color:#53e87a;background:#143c20;color:#edfff1}
.grade-save:disabled{opacity:.4;cursor:not-allowed}

/* uložený výsledek */
.exam-result-head{
  padding-left:0;padding-right:0;
}
.exam-result-title{
  color:#58e77a;
  font-size:clamp(1.55rem,6vw,2.65rem);
}
.exam-result-icon{
  width:112px;height:112px;
  margin:14px auto 18px;
  position:relative;
  border:4px solid #d7ecff;
  background:#f5fbff;
  box-shadow:7px 7px 0 #033545;
}
.exam-result-icon::before{
  content:"✓";
  position:absolute;
  inset:0;
  display:grid;
  place-items:center;
  color:#25c95a;
  font-family:var(--pixel);
  font-size:3.4rem;
  text-shadow:3px 3px 0 #0b6830;
}
.exam-result-icon::after{
  content:"";
  position:absolute;
  inset:-14px;
  border:4px dashed #45e46c;
  animation:resultPulse 1.15s steps(2,end) infinite;
}
@keyframes resultPulse{50%{opacity:.3;transform:scale(1.08)}}
.exam-result-summary{margin-top:8px}
.exam-result-grade{
  display:inline-grid;
  place-items:center;
  min-width:42px;
  min-height:36px;
  padding:3px 8px;
  border:2px solid #57e878;
  background:#123920;
  color:#ecfff1;
  font-family:var(--pixel);
}
.exam-result-grade.no-grade{
  border-color:#ff6a61;
  background:#411516;
}
.exam-result-quote{
  margin:14px 0;
  border:2px solid var(--cyan-dim);
  padding:12px;
  text-align:center;
  color:var(--cream);
  font-style:italic;
  background:#071923;
}
.exam-result-actions{
  display:grid;
  gap:10px;
}
.exam-result-next,
.exam-result-home{
  min-height:56px;
  font-family:var(--pixel);
  font-size:.74rem;
  text-transform:uppercase;
  box-shadow:5px 5px 0 #02070d;
}
.exam-result-next{
  border:3px solid #59a8ff;
  background:#0e58a5;
  color:#fff;
}
.exam-result-home{
  border:2px solid var(--cyan);
  background:#09202c;
  color:var(--cream);
}

@media(max-width:700px){
  .exam-live-main{grid-template-columns:1fr}
  .exam-student-panel{min-height:245px}
  .exam-live-head{padding-left:4px;padding-right:4px;padding-top:48px}
  .exam-live-step{left:50%;right:auto;transform:translateX(-50%);top:5px}
  .grade-picker{gap:5px}
  .grade-choice{min-height:60px}
}
@media(max-width:420px){
  .exam-live-context-row,.exam-result-row{grid-template-columns:76px minmax(0,1fr)}
  .grade-context div{grid-template-columns:72px minmax(0,1fr)}
  .grade-modal-actions{grid-template-columns:1fr}
  .grade-screen-modal{padding:10px}
  .exam-result-icon{width:92px;height:92px}
}



/* ======================================================================

body{

.home-container{width:min(941px,100%);padding:0 30px 24px}

}
.home-topbar::before{left:-5px;border-left:5px solid #20e8f3;clip-path:polygon(0 22%,28% 0,100% 0,100% 100%,0 100%)}

.home-topbar .brand-lockup{gap:20px}
.home-topbar .brand-mark{width:88px;height:88px;object-fit:cover}
.home-topbar .brand-main{
  font-size:clamp(1.8rem,4.5vw,2.65rem);letter-spacing:.02em;line-height:.95;

.home-topbar .brand-code{font-size:clamp(.9rem,2.3vw,1.25rem);margin-top:9px;letter-spacing:.18em;color:#21e7f1}
.home-topbar .nav-actions{gap:18px;margin-left:auto}
.home-topbar .icon-btn{width:64px;height:64px;min-width:64px;min-height:64px;padding:0;color:#25e9f2;font-size:2.25rem}
.home-topbar .icon-btn:first-child{position:relative}
.home-topbar .icon-btn:first-child::before{content:"";position:absolute;inset:7px;background:#25e9f2;clip-path:polygon(32% 0,68% 0,80% 12%,80% 40%,100% 58%,100% 78%,0 78%,0 58%,20% 40%,20% 12%);opacity:.95}
.home-topbar .icon-btn:first-child .avatar-chip{visibility:hidden}
.home-topbar .icon-btn.account-exit{font-size:2.65rem;border-left:4px solid #25e9f2;padding-left:20px;width:82px}

.arcade-home-head{margin:58px 0 34px;text-align:center}
.arcade-home-title{
  font-family:var(--pixel);font-size:clamp(3.2rem,9.6vw,5.9rem);line-height:.9;letter-spacing:-.035em;
  color:#fff2bb;text-transform:uppercase;
  text-shadow:0 5px 0 #ff4f12,0 9px 0 #b52e08,5px 10px 0 #00101e;
}
.arcade-home-title::before,.arcade-home-title::after{content:"—";color:#23e7f1;font-size:.34em;margin:0 .22em;vertical-align:.16em;text-shadow:none;font-weight:400}
.arcade-home-slogan{margin-top:24px;font-size:clamp(1rem,3.15vw,1.62rem);font-weight:900;color:#37e6f2;letter-spacing:.015em;text-shadow:0 2px 0 #06384b}
.home-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:15px 14px;margin-top:31px}
.home-card{
  min-height:188px;padding:14px 18px;grid-template-columns:172px minmax(0,1fr);gap:18px;
  border:5px solid #22e9f3;background:#031b31;
  box-shadow:inset 0 0 0 4px #07506d,inset 0 0 0 7px #02111f,0 0 0 1px #0b92a5;
}
.home-card::before{

}
.home-card[data-action="exam"]{
  border-color:#ffe07a;background:linear-gradient(180deg,#ff9d18,#ff7410);

.home-card[data-action="exam"]::before{border-color:rgba(107,42,0,.28)}
.home-card .home-icon{height:148px;width:100%;overflow:visible}
.home-card .home-icon img{width:142px;height:142px;object-fit:contain;filter:none}
.home-card h2{

}
.home-card[data-action="exam"] h2{color:#0d1420;text-shadow:none}
.home-card .unread-pill{font-size:.62rem;vertical-align:.32em}
.home-card:hover{filter:brightness(1.06)}
.home-card:active{transform:translate(2px,2px);box-shadow:inset 0 0 0 4px #07506d,inset 0 0 0 7px #02111f}
.home-card[data-action="exam"]:active{box-shadow:inset 0 0 0 5px #ffd944,inset 0 0 0 9px #d54508}

.home-bottom-decor{
  min-height:154px;margin:34px 0 0;display:grid;grid-template-columns:190px 1fr 170px;align-items:end;gap:20px;
  border-bottom:4px solid #24e7f1;padding:0 8px 24px;position:relative;
}
.home-bottom-decor::after{content:"";position:absolute;left:198px;right:183px;bottom:23px;height:4px;background:#23e7f1}
.home-books-decor{height:125px;display:flex;align-items:end;overflow:hidden}
.home-books-decor img{width:154px;height:126px;object-fit:contain;image-rendering:pixelated;transform:translateY(6px)}
.home-motto{align-self:center;text-align:center;color:#27e6f1;font-family:var(--pixel);font-weight:900;font-size:.9rem;letter-spacing:.13em;text-transform:uppercase;white-space:nowrap}
.home-lockers-decor{height:130px;display:flex;align-items:end;justify-content:center;gap:8px}
.home-lockers-decor span{width:50px;height:112px;border:5px solid #23e7f1;background:#05283c;box-shadow:inset 0 0 0 4px #08708d;position:relative}
.home-lockers-decor span::before{content:"";position:absolute;left:8px;right:8px;top:19px;height:6px;background:#23e7f1;box-shadow:0 13px 0 #23e7f1}
.home-lockers-decor span::after{content:"";position:absolute;left:11px;bottom:12px;width:8px;height:26px;background:#23e7f1}
.home-reference-footer{margin:64px 8px 0;padding:27px 4px 18px;border-top:4px solid #23e7f1;font-size:clamp(.72rem,2vw,1rem);letter-spacing:.08em;align-items:center}
.home-reference-footer .footer-sep{margin-left:auto;width:4px;height:34px;background:#23e7f1}
.home-reference-footer span:last-child{font-size:1.05em}

@media(max-width:760px){

  .home-bottom-decor{grid-template-columns:100px 1fr 92px;min-height:105px;margin-top:22px;padding-bottom:16px;gap:8px}.home-bottom-decor::after{left:104px;right:98px;bottom:15px;height:3px}.home-books-decor{height:82px}.home-books-decor img{width:96px;height:82px}.home-lockers-decor{height:86px;gap:4px}.home-lockers-decor span{width:29px;height:76px;border-width:3px}.home-lockers-decor span::before{left:4px;right:4px;top:12px;height:4px;box-shadow:0 9px 0 #23e7f1}.home-lockers-decor span::after{left:6px;bottom:7px;width:5px;height:17px}.home-motto{font-size:.54rem;letter-spacing:.08em}
  .home-reference-footer{margin-top:35px;padding-top:18px;font-size:.64rem}
}
@media(max-width:480px){
  .home-grid{grid-template-columns:1fr}
  .home-card{min-height:112px;grid-template-columns:96px 1fr}
  .home-bottom-decor{grid-template-columns:78px 1fr 70px}.home-motto{font-size:.45rem}.home-bottom-decor::after{left:82px;right:74px}
}


/* ======================================================================
   VISUAL FIDELITY PASS H2 — KROK 1 / VÝBĚR TŘÍDY A PŘEDMĚTU
   Rekonstrukce podle schválených referencí „Výběr třídy a předmětu“
   a „Zkouškomat s rozbaleným výběrem třídy“.
   ====================================================================== */
.fidelity-h2{max-width:881px;margin:0 auto;padding:0 0 10px}
.fidelity-h2 .exam-start-head{margin:32px 0 28px;padding:0 96px 0;text-align:center}
.fidelity-h2 .exam-start-title{
  font-size:clamp(3.15rem,9.7vw,5.8rem);line-height:.88;letter-spacing:-.045em;color:#fff0b7;
  text-shadow:0 5px 0 #ff4e11,0 9px 0 #aa2a07,5px 10px 0 #00101e
}
.fidelity-h2 .exam-start-title::before,.fidelity-h2 .exam-start-title::after{font-size:.30em;margin:0 .2em;vertical-align:.18em;color:#20e7f2}
.fidelity-h2 .exam-start-subtitle{margin-top:20px;font-size:clamp(1rem,3.3vw,1.55rem);letter-spacing:.015em;color:#2ae7f0;text-shadow:0 2px 0 #06394d}
.fidelity-h2 .exam-step{right:2px;bottom:-1px;font-size:clamp(.72rem,2.2vw,1rem);letter-spacing:.04em;color:#2ae7f0}
.fidelity-h2 .exam-start-section{margin-top:24px}
.fidelity-h2 .arcade-section-label{gap:14px;margin-bottom:10px}
.fidelity-h2 .arcade-section-label img{width:118px;height:88px;object-fit:contain}
.fidelity-h2 .arcade-section-label h2{font-size:clamp(1.75rem,5.5vw,2.85rem);letter-spacing:-.03em;color:#fff1c7;text-shadow:2px 2px 0 #06283b}

/* Custom opening class dropdown matching the approved open-state mockup. */
.class-picker{position:relative;margin:0;padding:0}
.class-picker summary{list-style:none}
.class-picker summary::-webkit-details-marker{display:none}

  function finishSplashWhenReady(){
    if(splashFinishScheduled)return;
    splashFinishScheduled=true;

    const waitForData=()=>{
      if(!appDataReady){
        splashFinishTimer=setTimeout(waitForData,100);
        return;
      }

      const elapsed=performance.now()-APP_BOOT_STARTED_AT;
      const remaining=Math.max(0,MIN_LOADING_MS-elapsed);

      splashFinishTimer=setTimeout(()=>{
        state.splashSeen=true;
        splashFinishScheduled=false;
        render();
      },remaining);
    };

    waitForData();
  }

      </section></div>`;
    modalRoot.querySelectorAll('[data-modal-index]').forEach(btn=>btn.addEventListener('click',()=>{
      const a=actions[Number(btn.dataset.modalIndex)];

      if(a && a.onClick) a.onClick();

  function studentById(id){ return state.students.find(s=>s.id===id); }
  function classById(id){ return state.classes.find(c=>c.id===id); }
  function ruleById(id){ return state.rules.find(r=>r.id===id); }
  function studentsForClass(classId){ const c=classById(classId); return c ? c.studentIds.map(studentById).filter(Boolean) : []; }
  function activeRules(){ return state.rules.filter(r=>r.active); }
  function baseRulePoints(student){
    return Object.entries(student.ruleStates||{}).reduce((sum,[rid,on])=>{
      const r=ruleById(rid); return sum + (on && r && r.active ? Number(r.points)||0 : 0);
    },0);
  }
  function currentPoints(student){
    return Math.max(0,baseRulePoints(student)+Number(student.lockerPointAdjust||0));
  }
  function applyLockerPoints(student,delta){
    const before=currentPoints(student);
    const after=Math.max(0,before+Number(delta||0));
    student.lockerPointAdjust=after-baseRulePoints(student);
    return {before,after,applied:after-before};
  }
  function isProtected(student){
    if(!student.lastExamAt || state.settings.protectionHours<=0) return false;
    return now()-student.lastExamAt < state.settings.protectionHours*3600*1000;
  }
  function teacherScore(t){ return t.studentCount ? Math.max(0,((t.examsCompleted-t.passesUsed)/t.studentCount)*100) : 0; }

  function syncCurrentTeacherStats(){
    const me=state.school.teachers.find(t=>t.id===state.user.id);
    if(!me) return;
    me.examsCompleted=state.history.filter(h=>h.teacherId===state.user.id && h.completed).length;
    me.passesUsed=state.history.filter(h=>h.teacherId===state.user.id && h.passUsed).length;
    me.studentCount=new Set(state.classes.flatMap(c=>c.studentIds)).size;
    me.lockerEnabledRate=state.settings.lockersEnabled?100:0;
    me.lockerAppearances=state.history.filter(h=>h.teacherId===state.user.id && h.lockerAppeared).length;
  }

  function gameSeasonBounds(){
    const season=state.gamification?.season||defaultGamification().season;
    const start=season.start?new Date(season.start+'T00:00:00').getTime():0;
    const end=season.end?new Date(season.end+'T23:59:59').getTime():Number.MAX_SAFE_INTEGER;
    return {season,start,end};
  }

  function gameEvent(type,data={}){
    if(!state.gamification?.enabled) return [];
    state.gamification.events=state.gamification.events||[];
    state.gamification.events.push({id:uid('ge'),type,teacherId:state.user.id,at:now(),...data});
    const unlocked=evaluateTrophies(state.user.id);
    saveState();
    if(unlocked.length) setTimeout(()=>showTrophyUnlocked(unlocked[unlocked.length-1]),80);
    return unlocked;
  }

  function teacherSeasonStats(teacherId){
    const {start,end}=gameSeasonBounds();
    const hist=(state.history||[]).filter(h=>h.teacherId===teacherId && Number(h.at)>=start && Number(h.at)<=end);
    const completed=hist.filter(h=>h.completed);
    const passes=hist.filter(h=>h.passUsed);
    const events=(state.gamification?.events||[]).filter(ev=>ev.teacherId===teacherId && Number(ev.at)>=start && Number(ev.at)<=end);
    const teacher=state.school.teachers.find(t=>t.id===teacherId)||{};
    const isCurrent=teacherId===state.user.id;
    const fallback=teacher.gameStats||{};
    return {
      completedExams:isCurrent?completed.length:Number(fallback.completedExams??teacher.examsCompleted??0),
      passesUsed:isCurrent?passes.length:Number(fallback.passesUsed??teacher.passesUsed??0),
